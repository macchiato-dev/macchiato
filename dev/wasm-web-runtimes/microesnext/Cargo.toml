[package]
name = "wasm-web-machine-microesnext-runtime"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dlmalloc = { version = "0.2", features = ["global"] }
microesnext = { path = "../../microquickjs-experiment/crates/microesnext", features = ["full"] }
libm = "0.2"
microesnext-regexp = { path = "../../microquickjs-experiment/crates/microesnext-regexp" }

[build-dependencies]
microesnext-compiler = { path = "../../microquickjs-experiment/crates/microesnext-compiler" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"
