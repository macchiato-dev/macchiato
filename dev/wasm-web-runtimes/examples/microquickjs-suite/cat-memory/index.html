<!doctype html>
<html>
<head>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
<!-- The guest may retain meaningful source comments as DOM nodes. -->
<svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
<path d="M20 48 L30 18 L44 40 Z" fill="#f0a93a">
</path>
<path d="M80 48 L70 18 L56 40 Z" fill="#f0a93a">
</path>
<ellipse cx="50" cy="58" rx="34" ry="28" fill="#f0a93a">
</ellipse>
<circle cx="38" cy="54" r="5" fill="#1b1533">
</circle>
<circle cx="62" cy="54" r="5" fill="#1b1533">
</circle>
<path d="M46 64 Q50 68 54 64 Q50 70 46 64 Z" fill="#ea7154">
</path>
</svg>
<h1>
Cat Memory Match
</h1>
<p class="tagline">
Sixteen cards, eight cats. Find every pair.
</p>
<div class="statline">
<div class="stat">
<span class="stat-label">
Moves
</span>
<span class="stat-value" id="moves">
0
</span>
</div>
<div class="stat">
<span class="stat-label">
Pairs
</span>
<span class="stat-value" id="matches">
0/8
</span>
</div>
</div>
<div class="table">
<div id="board" role="grid" aria-label="Memory game board">
</div>
</div>
<div class="controls">
<button id="reset" type="button">
New game
</button>
<div id="win" role="status" aria-label="Game result">
</div>
</div>
</main>
<script src="cat-memory.js">
</script>
</body>
</html>
