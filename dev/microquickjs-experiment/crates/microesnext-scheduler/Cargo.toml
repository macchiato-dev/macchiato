[package]
name = "microesnext-scheduler"
description = "Optional Promise, async, and thenable scheduling for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
async = ["microesnext-vm/async"]
promises = [
  "async",
  "dep:microesnext-arena",
  "dep:microesnext-execution",
  "microesnext-execution/promises",
  "microesnext-vm/functions",
]
resolution = ["promises", "microesnext-execution/promise-resolution"]
functions = [
  "resolution",
  "dep:microesnext-execution",
  "microesnext-execution/async-functions",
  "microesnext-vm/async-functions",
]
host-bindings = ["microesnext-vm/host-bindings"]
thenables = [
  "dep:microesnext-arena",
  "microesnext-arena/closures",
  "dep:microesnext-objects",
  "dep:microesnext-execution",
  "microesnext-execution/promise-resolvers",
  "microesnext-vm/objects",
  "microesnext-vm/promise-resolvers",
  "microesnext-vm/receivers",
]
async-thenables = ["functions", "thenables"]

[dependencies]
microesnext-types.workspace = true
microesnext-vm.workspace = true
microesnext-arena = { workspace = true, optional = true }
microesnext-execution = { workspace = true, optional = true }
microesnext-objects = { workspace = true, optional = true }

[dev-dependencies]
microesnext-bytecode.workspace = true
microesnext-compiler.workspace = true
microesnext-arena = { workspace = true, features = ["closures"] }

[lib]
path = "src/lib.rs"
