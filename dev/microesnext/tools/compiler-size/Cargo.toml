[package]
name = "microesnext-compiler-size"
description = "Final linked Wasm probe for progressive compiler builds"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
arrays = ["microesnext-compiler/arrays"]
array-indexing = ["microesnext-compiler/array-indexing"]
array-assignment-expressions = ["microesnext-compiler/array-assignment-expressions"]
async = ["microesnext-compiler/async"]
async-functions = ["microesnext-compiler/async-functions"]
control-flow = ["microesnext-compiler/control-flow"]
conditional-expressions = ["microesnext-compiler/conditional-expressions"]
constructors = ["microesnext-compiler/constructors"]
construction = ["microesnext-compiler/construction"]
classes = ["microesnext-compiler/classes"]
class-methods = ["microesnext-compiler/class-methods"]
class-default-constructors = ["microesnext-compiler/class-default-constructors"]
class-static-methods = ["microesnext-compiler/class-static-methods"]
class-expressions = ["microesnext-compiler/class-expressions"]
captured-assignment-expressions = ["microesnext-compiler/captured-assignment-expressions"]
equality = ["microesnext-compiler/equality"]
exceptions = ["microesnext-compiler/exceptions"]
expression-statements = ["microesnext-compiler/expression-statements"]
environments = ["microesnext-compiler/environments"]
functions = ["microesnext-compiler/functions"]
function-arguments = ["microesnext-compiler/function-arguments"]
implicit-completions = ["microesnext-compiler/implicit-completions"]
integer-operations = ["microesnext-compiler/integer-operations"]
integer-negation = ["microesnext-compiler/integer-negation"]
instanceof = ["microesnext-compiler/instanceof"]
logical-operations = ["microesnext-compiler/logical-operations"]
locals = ["microesnext-compiler/locals"]
literal-expressions = ["microesnext-compiler/literal-expressions"]
local-assignment-expressions = ["microesnext-compiler/local-assignment-expressions"]
number-coercion = ["microesnext-compiler/number-coercion"]
number-division = ["microesnext-compiler/number-division"]
number-remainder = ["microesnext-compiler/number-remainder"]
nonterminal-conditionals = ["microesnext-compiler/nonterminal-conditionals"]
nonterminal-exceptions = ["microesnext-compiler/nonterminal-exceptions"]
nested-conditionals = ["microesnext-compiler/nested-conditionals"]
nested-exceptions = ["microesnext-compiler/nested-exceptions"]
nested-loops = ["microesnext-compiler/nested-loops"]
string-number-coercion = ["microesnext-compiler/string-number-coercion"]
number-operations = ["microesnext-compiler/number-operations"]
number-negation = ["microesnext-compiler/number-negation"]
numbers = ["microesnext-compiler/numbers"]
objects = ["microesnext-compiler/objects"]
property-assignment = ["microesnext-compiler/property-assignment"]
property-assignment-expressions = ["microesnext-compiler/property-assignment-expressions"]
receivers = ["microesnext-compiler/receivers"]
recursive-async-functions = ["microesnext-compiler/recursive-async-functions"]
recursive-functions = ["microesnext-compiler/recursive-functions"]
recursive-constructors = ["microesnext-compiler/recursive-constructors"]
source-positions = ["microesnext-compiler/source-positions"]
structured-statements = ["microesnext-compiler/structured-statements"]
strings = ["microesnext-compiler/strings"]
string-operations = ["microesnext-compiler/string-operations"]
typeof = ["microesnext-compiler/typeof"]

[dependencies]
microesnext-compiler = { path = "../../crates/microesnext-compiler", default-features = false }

[[bin]]
name = "microesnext-compiler-size"
path = "src/main.rs"
