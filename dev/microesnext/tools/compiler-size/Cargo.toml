[package]
name = "microesnext-compiler-size"
description = "Final linked Wasm probe for progressive compiler builds"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
arrays = ["microesnext-compiler/arrays"]
async = ["microesnext-compiler/async"]
async-functions = ["microesnext-compiler/async-functions"]
control-flow = ["microesnext-compiler/control-flow"]
equality = ["microesnext-compiler/equality"]
exceptions = ["microesnext-compiler/exceptions"]
environments = ["microesnext-compiler/environments"]
functions = ["microesnext-compiler/functions"]
function-arguments = ["microesnext-compiler/function-arguments"]
integer-operations = ["microesnext-compiler/integer-operations"]
integer-negation = ["microesnext-compiler/integer-negation"]
logical-operations = ["microesnext-compiler/logical-operations"]
locals = ["microesnext-compiler/locals"]
number-operations = ["microesnext-compiler/number-operations"]
number-negation = ["microesnext-compiler/number-negation"]
numbers = ["microesnext-compiler/numbers"]
objects = ["microesnext-compiler/objects"]
receivers = ["microesnext-compiler/receivers"]
recursive-async-functions = ["microesnext-compiler/recursive-async-functions"]
recursive-functions = ["microesnext-compiler/recursive-functions"]
source-positions = ["microesnext-compiler/source-positions"]
strings = ["microesnext-compiler/strings"]
string-operations = ["microesnext-compiler/string-operations"]

[dependencies]
microesnext-compiler = { path = "../../crates/microesnext-compiler", default-features = false }

[[bin]]
name = "microesnext-compiler-size"
path = "src/main.rs"
