[package]
name = "microesnext-core-loop"
description = "Isolated native MicroESNext interpreter benchmark"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
arrays = ["microesnext/arrays"]
array-iterators = ["arrays", "iterators", "microesnext/array-iterators"]
async = ["microesnext/async"]
atoms = ["microesnext/atoms"]
collections = ["microesnext/collections"]
collection-iterators = ["collections", "iterators", "microesnext/collection-iterators"]
exceptions = ["microesnext/exceptions"]
functions = ["microesnext/functions"]
iterators = ["microesnext/iterators"]
iterator-results = ["microesnext/iterator-results"]
iterable-protocol = ["well-known-symbols", "microesnext/iterable-protocol"]
numbers = ["microesnext/numbers"]
objects = ["microesnext/objects"]
promises = ["microesnext/promises"]
strings = ["microesnext/strings"]
symbols = ["microesnext/symbols"]
well-known-symbols = ["symbols", "microesnext/well-known-symbols"]
weak-collections = ["microesnext/weak-collections"]

[dependencies]
microesnext.workspace = true
