[package]
name = "microesnext-capability-size"
description = "Final Wasm capability probe without compiler dev dependencies"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
arrays = ["microesnext/arrays"]
array-iterators = ["arrays", "iterators", "microesnext/array-iterators"]
async = ["microesnext/async"]
async-functions = ["async", "promises", "microesnext/async-functions"]
async-thenables = ["async-functions", "thenables", "microesnext/async-thenables"]
atoms = ["strings", "microesnext/atoms"]
collections = ["microesnext/collections"]
control-flow = ["microesnext/control-flow"]
collection-iterators = ["collections", "iterators", "microesnext/collection-iterators"]
collection-entry-iterators = [
  "arrays",
  "collections",
  "iterators",
  "microesnext/collection-entry-iterators",
]
exceptions = ["microesnext/exceptions"]
environments = ["microesnext/environments"]
equality = ["microesnext/equality"]
errors = ["microesnext/errors"]
functions = ["microesnext/functions"]
recursive-functions = ["functions", "environments", "microesnext/recursive-functions"]
recursive-async-functions = [
  "async-functions",
  "environments",
  "microesnext/recursive-async-functions",
]
receivers = ["function-arguments", "microesnext/receivers"]
function-arguments = ["functions", "locals", "microesnext/function-arguments"]
iterators = ["microesnext/iterators"]
iterator-results = ["microesnext/iterator-results"]
iterable-protocol = ["well-known-symbols", "microesnext/iterable-protocol"]
locals = ["microesnext/locals"]
logical-operations = ["microesnext/logical-operations"]
integer-negation = ["microesnext/integer-negation"]
minimal-program = ["microesnext/minimal-program"]
numbers = ["microesnext/numbers"]
number-coercion = ["numbers", "microesnext/number-coercion"]
string-number-coercion = ["number-coercion", "strings", "microesnext/string-number-coercion"]
number-operations = ["numbers", "microesnext/number-operations"]
number-negation = ["numbers", "integer-negation", "microesnext/number-negation"]
objects = ["atoms", "microesnext/objects"]
promises = ["microesnext/promises"]
promise-resolution = ["errors", "promises", "microesnext/promise-resolution"]
promise-resolvers = ["promise-resolution", "microesnext/promise-resolvers"]
thenables = ["objects", "promise-resolvers", "receivers", "microesnext/thenables"]
strings = ["microesnext/strings"]
string-operations = ["strings", "microesnext/string-operations"]
symbols = ["microesnext/symbols"]
well-known-symbols = ["symbols", "microesnext/well-known-symbols"]
weak-collections = ["microesnext/weak-collections"]

[dependencies]
microesnext.workspace = true
microesnext-arena.workspace = true
