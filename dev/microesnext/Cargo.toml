[workspace]
members = [
  "crates/microesnext",
  "crates/microesnext-arena",
  "crates/microesnext-scheduler",
  "crates/microesnext-execution",
  "crates/microesnext-bytecode",
  "crates/microesnext-bindings",
  "crates/microesnext-compiler",
  "crates/microesnext-semantics",
  "crates/microesnext-objects",
  "crates/microesnext-values",
  "crates/microesnext-types",
  "crates/microesnext-vm",
  "tools/capability-size",
  "tools/compiler-size",
  "tools/core-loop",
  "tools/decimal-speed",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/macchiato-dev/macchiato"
rust-version = "1.85"
version = "0.0.0"

[workspace.dependencies]
microesnext = { path = "crates/microesnext", version = "0.0.0", default-features = false }
microesnext-arena = { path = "crates/microesnext-arena", version = "0.0.0" }
microesnext-scheduler = { path = "crates/microesnext-scheduler", version = "0.0.0" }
microesnext-execution = { path = "crates/microesnext-execution", version = "0.0.0" }
microesnext-bytecode = { path = "crates/microesnext-bytecode", version = "0.0.0" }
microesnext-bindings = { path = "crates/microesnext-bindings", version = "0.0.0" }
microesnext-compiler = { path = "crates/microesnext-compiler", version = "0.0.0" }
microesnext-semantics = { path = "crates/microesnext-semantics", version = "0.0.0" }
microesnext-objects = { path = "crates/microesnext-objects", version = "0.0.0" }
microesnext-values = { path = "crates/microesnext-values", version = "0.0.0" }
microesnext-types = { path = "crates/microesnext-types", version = "0.0.0" }
microesnext-vm = { path = "crates/microesnext-vm", version = "0.0.0" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"
