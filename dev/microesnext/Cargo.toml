[workspace]
members = [
  "crates/microesnext-atoms",
  "crates/microesnext",
  "crates/microesnext-arena",
  "crates/microesnext-arrays",
  "crates/microesnext-async",
  "crates/microesnext-async-functions",
  "crates/microesnext-async-thenables",
  "crates/microesnext-bytecode",
  "crates/microesnext-bytecode-core",
  "crates/microesnext-compiler",
  "crates/microesnext-collections",
  "crates/microesnext-functions",
  "crates/microesnext-recursive-functions",
  "crates/microesnext-recursive-async-functions",
  "crates/microesnext-receivers",
  "crates/microesnext-parameters",
  "crates/microesnext-equality",
  "crates/microesnext-environments",
  "crates/microesnext-errors",
  "crates/microesnext-iterators",
  "crates/microesnext-iterator-results",
  "crates/microesnext-iterable-protocol",
  "crates/microesnext-integer-operations",
  "crates/microesnext-locals",
  "crates/microesnext-array-iterators",
  "crates/microesnext-collection-iterators",
  "crates/microesnext-collection-entry-iterators",
  "crates/microesnext-numbers",
  "crates/microesnext-exceptions",
  "crates/microesnext-objects",
  "crates/microesnext-promises",
  "crates/microesnext-promise-resolution",
  "crates/microesnext-promise-resolvers",
  "crates/microesnext-suspension",
  "crates/microesnext-strings",
  "crates/microesnext-symbols",
  "crates/microesnext-thenables",
  "crates/microesnext-well-known-symbols",
  "crates/microesnext-types",
  "crates/microesnext-truthiness",
  "crates/microesnext-vm",
  "crates/microesnext-vm-core",
  "crates/microesnext-weak-collections",
  "tools/capability-size",
  "tools/core-loop",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/macchiato-dev/macchiato"
rust-version = "1.85"
version = "0.0.0"

[workspace.dependencies]
microesnext = { path = "crates/microesnext", version = "0.0.0", default-features = false }
microesnext-atoms = { path = "crates/microesnext-atoms", version = "0.0.0" }
microesnext-arena = { path = "crates/microesnext-arena", version = "0.0.0" }
microesnext-arrays = { path = "crates/microesnext-arrays", version = "0.0.0" }
microesnext-async = { path = "crates/microesnext-async", version = "0.0.0" }
microesnext-async-functions = { path = "crates/microesnext-async-functions", version = "0.0.0" }
microesnext-async-thenables = { path = "crates/microesnext-async-thenables", version = "0.0.0" }
microesnext-bytecode = { path = "crates/microesnext-bytecode", version = "0.0.0" }
microesnext-bytecode-core = { path = "crates/microesnext-bytecode-core", version = "0.0.0" }
microesnext-compiler = { path = "crates/microesnext-compiler", version = "0.0.0" }
microesnext-collections = { path = "crates/microesnext-collections", version = "0.0.0" }
microesnext-functions = { path = "crates/microesnext-functions", version = "0.0.0" }
microesnext-recursive-functions = { path = "crates/microesnext-recursive-functions", version = "0.0.0" }
microesnext-recursive-async-functions = { path = "crates/microesnext-recursive-async-functions", version = "0.0.0" }
microesnext-receivers = { path = "crates/microesnext-receivers", version = "0.0.0" }
microesnext-parameters = { path = "crates/microesnext-parameters", version = "0.0.0" }
microesnext-equality = { path = "crates/microesnext-equality", version = "0.0.0" }
microesnext-environments = { path = "crates/microesnext-environments", version = "0.0.0" }
microesnext-errors = { path = "crates/microesnext-errors", version = "0.0.0" }
microesnext-iterators = { path = "crates/microesnext-iterators", version = "0.0.0" }
microesnext-iterator-results = { path = "crates/microesnext-iterator-results", version = "0.0.0" }
microesnext-iterable-protocol = { path = "crates/microesnext-iterable-protocol", version = "0.0.0" }
microesnext-integer-operations = { path = "crates/microesnext-integer-operations", version = "0.0.0" }
microesnext-locals = { path = "crates/microesnext-locals", version = "0.0.0" }
microesnext-array-iterators = { path = "crates/microesnext-array-iterators", version = "0.0.0" }
microesnext-collection-iterators = { path = "crates/microesnext-collection-iterators", version = "0.0.0" }
microesnext-collection-entry-iterators = { path = "crates/microesnext-collection-entry-iterators", version = "0.0.0" }
microesnext-numbers = { path = "crates/microesnext-numbers", version = "0.0.0" }
microesnext-exceptions = { path = "crates/microesnext-exceptions", version = "0.0.0" }
microesnext-objects = { path = "crates/microesnext-objects", version = "0.0.0" }
microesnext-promises = { path = "crates/microesnext-promises", version = "0.0.0" }
microesnext-promise-resolution = { path = "crates/microesnext-promise-resolution", version = "0.0.0" }
microesnext-promise-resolvers = { path = "crates/microesnext-promise-resolvers", version = "0.0.0" }
microesnext-suspension = { path = "crates/microesnext-suspension", version = "0.0.0" }
microesnext-strings = { path = "crates/microesnext-strings", version = "0.0.0" }
microesnext-symbols = { path = "crates/microesnext-symbols", version = "0.0.0" }
microesnext-thenables = { path = "crates/microesnext-thenables", version = "0.0.0" }
microesnext-well-known-symbols = { path = "crates/microesnext-well-known-symbols", version = "0.0.0" }
microesnext-types = { path = "crates/microesnext-types", version = "0.0.0" }
microesnext-truthiness = { path = "crates/microesnext-truthiness", version = "0.0.0" }
microesnext-vm = { path = "crates/microesnext-vm", version = "0.0.0" }
microesnext-vm-core = { path = "crates/microesnext-vm-core", version = "0.0.0" }
microesnext-weak-collections = { path = "crates/microesnext-weak-collections", version = "0.0.0" }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"
