[package]
name = "microesnext"
description = "A compact JavaScript engine with explicit removable capabilities"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
control-flow = [
  "microesnext-vm/control-flow",
  "microesnext-compiler/control-flow",
  "microesnext-compiler/conditional-expressions",
]
expression-statements = ["stack-operations", "microesnext-compiler/expression-statements"]
implicit-completions = ["microesnext-compiler/implicit-completions"]
constructors = [
  "callable-objects",
  "microesnext-vm/constructors",
  "microesnext-compiler/constructors",
]
class-constructors = [
  "constructors",
  "microesnext-objects/class-constructors",
  "microesnext-semantics?/class-constructors",
  "microesnext-vm/class-constructors",
]
construction = [
  "constructors",
  "receivers",
  "microesnext-objects/construction",
  "microesnext-vm/construction",
  "microesnext-compiler/construction",
]
classes = [
  "class-constructors",
  "construction",
  "property-assignment",
  "microesnext-compiler/classes",
  "microesnext-compiler/class-default-constructors",
]
method-calls = [
  "callable-objects",
  "function-arguments",
  "objects",
  "receivers",
  "microesnext-objects/method-calls",
  "microesnext-vm/method-calls",
  "microesnext-compiler/method-calls",
]
class-methods = ["classes", "method-calls", "microesnext-compiler/class-methods"]
class-static-methods = ["class-methods", "microesnext-compiler/class-static-methods"]
class-expressions = [
  "class-static-methods",
  "stack-operations",
  "microesnext-compiler/class-expressions",
]
locals = [
  "dep:microesnext-bindings",
  "microesnext-bindings/locals",
  "microesnext-vm/locals",
  "microesnext-compiler/locals",
]
local-assignment-expressions = [
  "locals",
  "stack-operations",
  "microesnext-compiler/local-assignment-expressions",
]
arrays = [
  "dep:microesnext-arrays",
  "microesnext-vm/arrays",
  "microesnext-compiler/arrays",
  "microesnext-compiler/array-indexing",
]
array-assignment-expressions = [
  "arrays",
  "microesnext-arrays/assignment-expressions",
  "microesnext-vm/array-assignment-expressions",
  "microesnext-compiler/array-assignment-expressions",
]
array-iterators = ["arrays", "iterators", "microesnext-arrays/iterators"]
async = [
  "dep:microesnext-scheduler",
  "microesnext-scheduler/async",
  "microesnext-compiler/async",
]
async-functions = [
  "async",
  "functions",
  "promises",
  "promise-resolution",
  "dep:microesnext-execution",
  "microesnext-execution/async-functions",
  "microesnext-scheduler/functions",
  "microesnext-vm/async-functions",
  "microesnext-semantics?/async-functions",
  "microesnext-compiler/async-functions",
]
async-thenables = [
  "async-functions",
  "thenables",
  "microesnext-scheduler/async-thenables",
]
strings = [
  "dep:microesnext-strings",
  "microesnext-vm/strings",
  "microesnext-collections?/string-keys",
  "microesnext-semantics?/string-values",
  "microesnext-compiler/strings",
]
stack-operations = [
  "microesnext-arena/stack-operations",
  "microesnext-vm/stack-operations",
]
string-operations = [
  "strings",
  "microesnext-vm/string-operations",
  "microesnext-compiler/string-operations",
]
symbols = ["dep:microesnext-symbols", "microesnext-semantics?/symbols"]
well-known-symbols = ["symbols"]
atoms = ["strings", "microesnext-vm/atoms"]
objects = [
  "dep:microesnext-objects",
  "atoms",
  "microesnext-vm/objects",
  "microesnext-compiler/objects",
]
property-assignment = [
  "objects",
  "microesnext-vm/property-assignment",
  "microesnext-compiler/property-assignment",
]
prototype-chain = ["objects", "microesnext-objects/prototype-chain"]
functions = [
  "microesnext-arena/closures",
  "microesnext-vm/functions",
  "microesnext-compiler/functions",
]
callable-objects = [
  "functions",
  "objects",
  "microesnext-objects/callable-objects",
  "microesnext-vm/callable-objects",
  "microesnext-semantics?/callable-objects",
]
function-arguments = [
  "functions",
  "locals",
  "microesnext-bindings/parameters",
  "microesnext-vm/function-arguments",
  "microesnext-compiler/function-arguments",
]
integer-operations = [
  "dep:microesnext-integer-operations",
  "microesnext-vm/integer-operations",
  "microesnext-compiler/integer-operations",
]
integer-negation = [
  "dep:microesnext-integer-operations",
  "microesnext-vm/integer-negation",
  "microesnext-compiler/integer-negation",
]
instanceof = [
  "callable-objects",
  "microesnext-objects/instanceof",
  "microesnext-vm/instanceof",
  "microesnext-compiler/instanceof",
]
minimal-program = ["control-flow", "integer-operations", "locals"]
equality = [
  "dep:microesnext-semantics",
  "microesnext-semantics/equality",
  "microesnext-vm/equality",
  "microesnext-compiler/equality",
]
logical-operations = [
  "dep:microesnext-semantics",
  "microesnext-semantics/logical-operations",
  "microesnext-vm/logical-operations",
  "microesnext-compiler/logical-operations",
]
numbers = [
  "dep:microesnext-numbers",
  "microesnext-vm/numbers",
  "microesnext-collections?/number-keys",
  "microesnext-semantics?/numbers",
  "microesnext-compiler/numbers",
]
number-operations = [
  "numbers",
  "integer-operations",
  "microesnext-vm/number-operations",
  "microesnext-compiler/number-operations",
]
number-negation = [
  "numbers",
  "integer-negation",
  "microesnext-vm/number-negation",
  "microesnext-compiler/number-negation",
]
number-coercion = [
  "numbers",
  "microesnext-vm/number-coercion",
  "microesnext-compiler/number-coercion",
]
number-division = [
  "numbers",
  "microesnext-vm/number-division",
  "microesnext-compiler/number-division",
]
number-remainder = [
  "numbers",
  "microesnext-vm/number-remainder",
  "microesnext-compiler/number-remainder",
]
nonterminal-conditionals = ["control-flow", "microesnext-compiler/nonterminal-conditionals"]
nonterminal-exceptions = [
  "control-flow",
  "exceptions",
  "microesnext-compiler/nonterminal-exceptions",
]
nested-conditionals = [
  "nonterminal-conditionals",
  "microesnext-compiler/nested-conditionals",
]
nested-loops = ["nested-conditionals", "microesnext-compiler/nested-loops"]
nested-exceptions = [
  "nonterminal-exceptions",
  "microesnext-compiler/nested-exceptions",
]
structured-statements = [
  "nested-exceptions",
  "nested-loops",
  "microesnext-compiler/structured-statements",
]
string-number-coercion = [
  "number-coercion",
  "strings",
  "microesnext-numbers/string-coercion",
  "microesnext-vm/string-number-coercion",
  "microesnext-compiler/string-number-coercion",
]
typeof = [
  "strings",
  "dep:microesnext-semantics",
  "microesnext-semantics/typeof",
  "microesnext-vm/typeof",
  "microesnext-compiler/typeof",
]
exceptions = [
  "dep:microesnext-exceptions",
  "microesnext-vm/exceptions",
  "microesnext-compiler/exceptions",
]
errors = ["dep:microesnext-errors"]
environments = [
  "microesnext-bindings/environments",
  "microesnext-vm/environments",
  "microesnext-compiler/environments",
]
captured-assignment-expressions = [
  "environments",
  "microesnext-bindings/assignment-expressions",
  "microesnext-vm/captured-assignment-expressions",
  "microesnext-compiler/captured-assignment-expressions",
]
property-assignment-expressions = [
  "objects",
  "microesnext-objects/assignment-expressions",
  "microesnext-vm/property-assignment-expressions",
  "microesnext-compiler/property-assignment-expressions",
]
recursive-functions = [
  "functions",
  "environments",
  "microesnext-bindings/recursive-functions",
  "microesnext-vm/recursive-functions",
  "microesnext-compiler/recursive-functions",
]
recursive-constructors = [
  "constructors",
  "recursive-functions",
  "microesnext-objects/recursive-constructors",
  "microesnext-vm/recursive-constructors",
  "microesnext-compiler/recursive-constructors",
]
recursive-async-functions = [
  "async-functions",
  "environments",
  "microesnext-execution/recursive-async-functions",
  "microesnext-vm/recursive-async-functions",
  "microesnext-compiler/recursive-async-functions",
]
receivers = [
  "function-arguments",
  "microesnext-bindings/receivers",
  "microesnext-vm/receivers",
  "microesnext-compiler/receivers",
]
collections = ["dep:microesnext-collections"]
collection-iterators = ["collections", "iterators", "microesnext-collections/iterators"]
collection-entry-iterators = [
  "arrays",
  "collections",
  "iterators",
  "microesnext-collections/entry-iterators",
]
iterators = ["dep:microesnext-iterators"]
iterator-results = [
  "atoms",
  "microesnext-iterators/results",
  "dep:microesnext-objects",
]
iterable-protocol = [
  "microesnext-iterators/protocol",
  "dep:microesnext-objects",
  "well-known-symbols",
]
weak-collections = ["collections", "microesnext-collections/weak"]
promises = ["dep:microesnext-promises"]
promise-resolution = [
  "promises",
  "microesnext-promises/resolution",
]
promise-resolvers = [
  "promise-resolution",
  "microesnext-promises/resolvers",
  "microesnext-vm/promise-resolvers",
  "microesnext-semantics?/promise-resolvers",
]
thenables = [
  "objects",
  "promise-resolvers",
  "receivers",
  "dep:microesnext-scheduler",
  "microesnext-scheduler/thenables",
]
promise-jobs = [
  "async",
  "functions",
  "promise-resolution",
  "microesnext-scheduler/resolution",
]

[dependencies]
microesnext-arena.workspace = true
microesnext-scheduler = { workspace = true, optional = true }
microesnext-execution = { workspace = true, optional = true }
microesnext-arrays = { workspace = true, optional = true }
microesnext-collections = { workspace = true, optional = true }
microesnext-promises = { workspace = true, optional = true }
microesnext-bindings = { workspace = true, optional = true }
microesnext-iterators = { workspace = true, optional = true }
microesnext-integer-operations = { workspace = true, optional = true }
microesnext-semantics = { workspace = true, optional = true }
microesnext-numbers = { workspace = true, optional = true }
microesnext-exceptions = { workspace = true, optional = true }
microesnext-errors = { workspace = true, optional = true }
microesnext-objects = { workspace = true, optional = true }
microesnext-strings = { workspace = true, optional = true }
microesnext-symbols = { workspace = true, optional = true }
microesnext-bytecode.workspace = true
microesnext-types.workspace = true
microesnext-vm.workspace = true
microesnext-vm-core.workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
microesnext-compiler = { path = "../microesnext-compiler", default-features = false }

[[test]]
name = "source"
path = "tests/source.rs"
required-features = ["async", "exceptions", "locals"]

[[test]]
name = "source_strings"
path = "tests/source_strings.rs"
required-features = ["strings"]

[[test]]
name = "source_logical"
path = "tests/source_logical.rs"
required-features = ["logical-operations", "strings"]

[[test]]
name = "immediates"
path = "tests/immediates.rs"

[[test]]
name = "expression-statements"
path = "tests/expression_statements.rs"
required-features = ["expression-statements"]

[[test]]
name = "implicit-completions"
path = "tests/implicit_completions.rs"
required-features = ["implicit-completions"]

[[test]]
name = "locals"
path = "tests/locals.rs"
required-features = ["locals"]

[[test]]
name = "local-assignment-expressions"
path = "tests/local_assignment_expressions.rs"
required-features = ["local-assignment-expressions"]

[[test]]
name = "captured-assignment-expressions"
path = "tests/captured_assignment_expressions.rs"
required-features = [
  "captured-assignment-expressions",
  "function-arguments",
  "local-assignment-expressions",
]

[[test]]
name = "property-assignment-expressions"
path = "tests/property_assignment_expressions.rs"
required-features = [
  "local-assignment-expressions",
  "locals",
  "objects",
  "property-assignment-expressions",
]

[[test]]
name = "captured-property-assignment-expressions"
path = "tests/captured_property_assignment_expressions.rs"
required-features = [
  "environments",
  "function-arguments",
  "objects",
  "property-assignment-expressions",
]

[[test]]
name = "functions"
path = "tests/functions.rs"
required-features = [
  "control-flow",
  "environments",
  "function-arguments",
  "numbers",
  "recursive-functions",
]

[[test]]
name = "async-functions"
path = "tests/async_functions.rs"
required-features = [
  "async-functions",
  "environments",
  "function-arguments",
  "recursive-async-functions",
]

[[test]]
name = "control-flow"
path = "tests/control_flow.rs"
required-features = ["control-flow", "locals"]

[[test]]
name = "conditional-expressions"
path = "tests/conditional_expressions.rs"
required-features = ["control-flow"]

[[test]]
name = "conditional-functions"
path = "tests/conditional_functions.rs"
required-features = ["control-flow", "function-arguments"]

[[test]]
name = "conditional-assignments"
path = "tests/conditional_assignments.rs"
required-features = ["control-flow", "local-assignment-expressions"]

[[test]]
name = "minimal-program"
path = "tests/minimal_program.rs"
required-features = ["minimal-program"]

[[test]]
name = "nonterminal-conditionals"
path = "tests/nonterminal_conditionals.rs"
required-features = ["locals", "nonterminal-conditionals"]

[[test]]
name = "nested-conditionals"
path = "tests/nested_conditionals.rs"
required-features = ["locals", "nested-conditionals"]

[[test]]
name = "nested-loops"
path = "tests/nested_loops.rs"
required-features = ["locals", "nested-loops"]

[[test]]
name = "nested-exceptions"
path = "tests/nested_exceptions.rs"
required-features = ["nested-exceptions"]

[[test]]
name = "nonterminal-exceptions"
path = "tests/nonterminal_exceptions.rs"
required-features = ["locals", "nonterminal-exceptions"]

[[test]]
name = "structured-statements"
path = "tests/structured_statements.rs"
required-features = ["structured-statements"]

[[test]]
name = "equality"
path = "tests/equality.rs"
required-features = ["equality", "locals", "numbers", "objects", "strings"]

[[test]]
name = "logical-operations"
path = "tests/logical_operations.rs"
required-features = ["function-arguments", "logical-operations"]

[[test]]
name = "objects"
path = "tests/objects.rs"
required-features = ["objects"]

[[test]]
name = "literal-expressions"
path = "tests/literal_expressions.rs"
required-features = [
  "arrays",
  "constructors",
  "function-arguments",
  "objects",
  "receivers",
]

[[test]]
name = "arrays"
path = "tests/arrays.rs"
required-features = ["arrays"]

[[test]]
name = "array-indexing"
path = "tests/array_indexing.rs"
required-features = ["arrays"]

[[test]]
name = "array-assignment-expressions"
path = "tests/array_assignment_expressions.rs"
required-features = ["array-assignment-expressions", "arrays", "locals"]

[[test]]
name = "captured-array-assignment-expressions"
path = "tests/captured_array_assignment_expressions.rs"
required-features = [
  "array-assignment-expressions",
  "arrays",
  "environments",
  "function-arguments",
  "objects",
]

[[test]]
name = "receiver-array-assignment-expressions"
path = "tests/receiver_array_assignment_expressions.rs"
required-features = [
  "array-assignment-expressions",
  "class-methods",
  "construction",
  "property-assignment",
]

[[test]]
name = "numbers"
path = "tests/numbers.rs"
required-features = ["locals", "number-coercion", "number-negation", "number-operations"]

[[test]]
name = "string-number-coercion"
path = "tests/string_number_coercion.rs"
required-features = ["number-negation", "string-number-coercion"]

[[test]]
name = "typeof"
path = "tests/typeof.rs"
required-features = ["functions", "numbers", "objects", "typeof"]

[[test]]
name = "constructors"
path = "tests/constructors.rs"
required-features = ["constructors", "equality", "locals", "objects", "typeof"]

[[test]]
name = "construction"
path = "tests/construction.rs"
required-features = [
  "construction",
  "environments",
  "equality",
  "instanceof",
  "locals",
  "objects",
  "property-assignment",
]

[[test]]
name = "classes"
path = "tests/classes.rs"
required-features = ["classes", "instanceof", "locals", "objects", "typeof"]

[[test]]
name = "class-methods"
path = "tests/class_methods.rs"
required-features = ["class-methods", "locals", "objects"]

[[test]]
name = "class-expressions"
path = "tests/class_expressions.rs"
required-features = ["class-expressions", "locals", "objects"]

[[test]]
name = "recursive-constructors"
path = "tests/recursive_constructors.rs"
required-features = [
  "construction",
  "equality",
  "locals",
  "objects",
  "recursive-constructors",
]

[[test]]
name = "symbols"
path = "tests/symbols.rs"
required-features = ["objects", "symbols"]

[[test]]
name = "iteration"
path = "tests/iteration.rs"
required-features = [
  "array-iterators",
  "collection-iterators",
  "iterator-results",
]
