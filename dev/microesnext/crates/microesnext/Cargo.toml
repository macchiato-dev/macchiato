[package]
name = "microesnext"
description = "A compact JavaScript engine with explicit removable capabilities"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
control-flow = ["microesnext-vm/control-flow"]
expression-statements = ["stack-operations"]
implicit-completions = []
constructors = ["callable-objects", "microesnext-vm/constructors"]
class-constructors = [
  "constructors",
  "dep:microesnext-class-constructors",
  "microesnext-instanceof?/class-constructors",
  "microesnext-typeof?/class-constructors",
  "microesnext-vm/class-constructors",
]
construction = ["constructors", "receivers", "microesnext-vm/construction"]
classes = [
  "class-constructors",
  "construction",
  "property-assignment",
]
method-calls = [
  "callable-objects",
  "function-arguments",
  "objects",
  "receivers",
  "dep:microesnext-method-calls",
  "microesnext-vm/method-calls",
]
class-methods = ["classes", "method-calls"]
class-static-methods = ["class-methods"]
class-expressions = ["class-static-methods", "stack-operations"]
locals = ["dep:microesnext-locals", "microesnext-vm/locals"]
local-assignment-expressions = ["locals", "stack-operations"]
arrays = ["dep:microesnext-arrays", "microesnext-vm/arrays"]
array-assignment-expressions = [
  "arrays",
  "dep:microesnext-array-assignment-expressions",
  "microesnext-vm/array-assignment-expressions",
]
array-iterators = ["arrays", "iterators", "dep:microesnext-array-iterators"]
async = ["dep:microesnext-async"]
async-functions = [
  "async",
  "functions",
  "promises",
  "promise-resolution",
  "dep:microesnext-async-functions",
  "microesnext-async/functions",
  "microesnext-vm/async-functions",
  "microesnext-typeof?/async-functions",
]
async-thenables = [
  "async-functions",
  "thenables",
  "dep:microesnext-async-thenables",
]
strings = [
  "dep:microesnext-strings",
  "microesnext-vm/strings",
  "microesnext-collections?/string-keys",
  "microesnext-equality?/strings",
  "microesnext-logical-operations?/strings",
]
stack-operations = [
  "dep:microesnext-stack-operations",
  "microesnext-vm/stack-operations",
]
string-operations = [
  "strings",
  "dep:microesnext-string-operations",
  "microesnext-vm/string-operations",
]
symbols = ["dep:microesnext-symbols", "microesnext-typeof?/symbols"]
well-known-symbols = ["symbols", "dep:microesnext-well-known-symbols"]
atoms = ["dep:microesnext-atoms", "strings", "microesnext-vm/atoms"]
objects = ["dep:microesnext-objects", "atoms", "microesnext-vm/objects"]
property-assignment = ["objects", "microesnext-vm/property-assignment"]
prototype-chain = ["objects", "dep:microesnext-prototype-chain"]
functions = ["microesnext-arena/closures", "microesnext-vm/functions"]
callable-objects = [
  "functions",
  "objects",
  "dep:microesnext-callable-objects",
  "microesnext-vm/callable-objects",
  "microesnext-typeof?/callable-objects",
]
function-arguments = [
  "functions",
  "locals",
  "dep:microesnext-parameters",
  "microesnext-vm/function-arguments",
]
integer-operations = [
  "dep:microesnext-integer-operations",
  "microesnext-vm/integer-operations",
]
integer-negation = [
  "dep:microesnext-integer-negation",
  "microesnext-vm/integer-negation",
]
instanceof = [
  "callable-objects",
  "prototype-chain",
  "dep:microesnext-instanceof",
  "microesnext-vm/instanceof",
]
minimal-program = ["control-flow", "integer-operations", "locals"]
equality = ["dep:microesnext-equality", "microesnext-vm/equality"]
logical-operations = [
  "dep:microesnext-logical-operations",
  "microesnext-vm/logical-operations",
]
numbers = [
  "dep:microesnext-numbers",
  "microesnext-vm/numbers",
  "microesnext-collections?/number-keys",
  "microesnext-equality?/numbers",
  "microesnext-logical-operations?/numbers",
  "microesnext-typeof?/numbers",
]
number-operations = [
  "numbers",
  "integer-operations",
  "microesnext-numbers/operations",
  "microesnext-vm/number-operations",
]
number-negation = [
  "numbers",
  "integer-negation",
  "microesnext-numbers/negation",
  "microesnext-vm/number-negation",
]
number-coercion = [
  "numbers",
  "microesnext-numbers/coercion",
  "microesnext-vm/number-coercion",
]
number-division = [
  "numbers",
  "microesnext-numbers/division",
  "microesnext-vm/number-division",
]
number-remainder = [
  "numbers",
  "microesnext-numbers/remainder",
  "microesnext-vm/number-remainder",
]
nonterminal-conditionals = ["control-flow"]
nonterminal-exceptions = ["control-flow", "exceptions"]
nested-conditionals = ["nonterminal-conditionals"]
nested-loops = ["nested-conditionals"]
nested-exceptions = ["nonterminal-exceptions"]
structured-statements = ["nested-exceptions", "nested-loops"]
string-number-coercion = [
  "number-coercion",
  "strings",
  "microesnext-numbers/string-coercion",
  "microesnext-vm/string-number-coercion",
]
typeof = ["strings", "dep:microesnext-typeof", "microesnext-vm/typeof"]
exceptions = ["dep:microesnext-exceptions", "microesnext-vm/exceptions"]
errors = ["dep:microesnext-errors"]
environments = ["dep:microesnext-environments", "microesnext-vm/environments"]
captured-assignment-expressions = [
  "environments",
  "dep:microesnext-captured-assignment-expressions",
  "microesnext-vm/captured-assignment-expressions",
]
property-assignment-expressions = [
  "objects",
  "dep:microesnext-property-assignment-expressions",
  "microesnext-vm/property-assignment-expressions",
]
recursive-functions = [
  "functions",
  "environments",
  "dep:microesnext-recursive-functions",
  "microesnext-vm/recursive-functions",
]
recursive-constructors = [
  "constructors",
  "recursive-functions",
  "microesnext-vm/recursive-constructors",
]
recursive-async-functions = [
  "async-functions",
  "environments",
  "dep:microesnext-recursive-async-functions",
  "microesnext-vm/recursive-async-functions",
]
receivers = [
  "function-arguments",
  "dep:microesnext-receivers",
  "microesnext-vm/receivers",
]
collections = ["dep:microesnext-collections"]
collection-iterators = ["collections", "iterators", "dep:microesnext-collection-iterators"]
collection-entry-iterators = [
  "arrays",
  "collections",
  "iterators",
  "dep:microesnext-collection-entry-iterators",
]
iterators = ["dep:microesnext-iterators"]
iterator-results = [
  "dep:microesnext-atoms",
  "dep:microesnext-iterator-results",
  "dep:microesnext-objects",
]
iterable-protocol = [
  "dep:microesnext-iterable-protocol",
  "dep:microesnext-objects",
  "well-known-symbols",
]
weak-collections = ["collections", "microesnext-collections/weak"]
promises = ["dep:microesnext-promises"]
promise-resolution = [
  "promises",
  "dep:microesnext-promise-resolution",
]
promise-resolvers = [
  "promise-resolution",
  "dep:microesnext-promise-resolvers",
  "microesnext-vm/promise-resolvers",
  "microesnext-typeof?/promise-resolvers",
]
thenables = [
  "objects",
  "promise-resolvers",
  "receivers",
  "dep:microesnext-thenables",
]
promise-jobs = [
  "async",
  "functions",
  "promise-resolution",
  "microesnext-async/resolution",
]

[dependencies]
microesnext-arena.workspace = true
microesnext-async = { workspace = true, optional = true }
microesnext-async-functions = { workspace = true, optional = true }
microesnext-async-thenables = { workspace = true, optional = true }
microesnext-arrays = { workspace = true, optional = true }
microesnext-array-iterators = { workspace = true, optional = true }
microesnext-array-assignment-expressions = { workspace = true, optional = true }
microesnext-atoms = { workspace = true, optional = true }
microesnext-collections = { workspace = true, optional = true }
microesnext-callable-objects = { workspace = true, optional = true }
microesnext-class-constructors = { workspace = true, optional = true }
microesnext-captured-assignment-expressions = { workspace = true, optional = true }
microesnext-property-assignment-expressions = { workspace = true, optional = true }
microesnext-collection-iterators = { workspace = true, optional = true }
microesnext-collection-entry-iterators = { workspace = true, optional = true }
microesnext-promises = { workspace = true, optional = true }
microesnext-prototype-chain = { workspace = true, optional = true }
microesnext-promise-resolution = { workspace = true, optional = true }
microesnext-promise-resolvers = { workspace = true, optional = true }
microesnext-method-calls = { workspace = true, optional = true }
microesnext-parameters = { workspace = true, optional = true }
microesnext-iterators = { workspace = true, optional = true }
microesnext-iterator-results = { workspace = true, optional = true }
microesnext-iterable-protocol = { workspace = true, optional = true }
microesnext-integer-operations = { workspace = true, optional = true }
microesnext-integer-negation = { workspace = true, optional = true }
microesnext-instanceof = { workspace = true, optional = true }
microesnext-locals = { workspace = true, optional = true }
microesnext-logical-operations = { workspace = true, optional = true }
microesnext-numbers = { workspace = true, optional = true }
microesnext-typeof = { workspace = true, optional = true }
microesnext-exceptions = { workspace = true, optional = true }
microesnext-environments = { workspace = true, optional = true }
microesnext-equality = { workspace = true, optional = true }
microesnext-errors = { workspace = true, optional = true }
microesnext-recursive-functions = { workspace = true, optional = true }
microesnext-recursive-async-functions = { workspace = true, optional = true }
microesnext-receivers = { workspace = true, optional = true }
microesnext-objects = { workspace = true, optional = true }
microesnext-strings = { workspace = true, optional = true }
microesnext-stack-operations = { workspace = true, optional = true }
microesnext-string-operations = { workspace = true, optional = true }
microesnext-symbols = { workspace = true, optional = true }
microesnext-thenables = { workspace = true, optional = true }
microesnext-well-known-symbols = { workspace = true, optional = true }
microesnext-bytecode.workspace = true
microesnext-types.workspace = true
microesnext-vm.workspace = true
microesnext-vm-core.workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
microesnext-compiler.workspace = true

[[test]]
name = "source"
path = "tests/source.rs"
required-features = ["async", "exceptions", "locals"]

[[test]]
name = "source_strings"
path = "tests/source_strings.rs"
required-features = ["strings"]

[[test]]
name = "source_logical"
path = "tests/source_logical.rs"
required-features = ["logical-operations", "strings"]

[[test]]
name = "immediates"
path = "tests/immediates.rs"

[[test]]
name = "expression-statements"
path = "tests/expression_statements.rs"
required-features = ["expression-statements"]

[[test]]
name = "implicit-completions"
path = "tests/implicit_completions.rs"
required-features = ["implicit-completions"]

[[test]]
name = "locals"
path = "tests/locals.rs"
required-features = ["locals"]

[[test]]
name = "local-assignment-expressions"
path = "tests/local_assignment_expressions.rs"
required-features = ["local-assignment-expressions"]

[[test]]
name = "captured-assignment-expressions"
path = "tests/captured_assignment_expressions.rs"
required-features = [
  "captured-assignment-expressions",
  "function-arguments",
  "local-assignment-expressions",
]

[[test]]
name = "property-assignment-expressions"
path = "tests/property_assignment_expressions.rs"
required-features = [
  "local-assignment-expressions",
  "locals",
  "objects",
  "property-assignment-expressions",
]

[[test]]
name = "captured-property-assignment-expressions"
path = "tests/captured_property_assignment_expressions.rs"
required-features = [
  "environments",
  "function-arguments",
  "objects",
  "property-assignment-expressions",
]

[[test]]
name = "functions"
path = "tests/functions.rs"
required-features = [
  "control-flow",
  "environments",
  "function-arguments",
  "numbers",
  "recursive-functions",
]

[[test]]
name = "async-functions"
path = "tests/async_functions.rs"
required-features = [
  "async-functions",
  "environments",
  "function-arguments",
  "recursive-async-functions",
]

[[test]]
name = "control-flow"
path = "tests/control_flow.rs"
required-features = ["control-flow", "locals"]

[[test]]
name = "conditional-expressions"
path = "tests/conditional_expressions.rs"
required-features = ["control-flow"]

[[test]]
name = "conditional-functions"
path = "tests/conditional_functions.rs"
required-features = ["control-flow", "function-arguments"]

[[test]]
name = "conditional-assignments"
path = "tests/conditional_assignments.rs"
required-features = ["control-flow", "local-assignment-expressions"]

[[test]]
name = "minimal-program"
path = "tests/minimal_program.rs"
required-features = ["minimal-program"]

[[test]]
name = "nonterminal-conditionals"
path = "tests/nonterminal_conditionals.rs"
required-features = ["locals", "nonterminal-conditionals"]

[[test]]
name = "nested-conditionals"
path = "tests/nested_conditionals.rs"
required-features = ["locals", "nested-conditionals"]

[[test]]
name = "nested-loops"
path = "tests/nested_loops.rs"
required-features = ["locals", "nested-loops"]

[[test]]
name = "nested-exceptions"
path = "tests/nested_exceptions.rs"
required-features = ["nested-exceptions"]

[[test]]
name = "nonterminal-exceptions"
path = "tests/nonterminal_exceptions.rs"
required-features = ["locals", "nonterminal-exceptions"]

[[test]]
name = "structured-statements"
path = "tests/structured_statements.rs"
required-features = ["structured-statements"]

[[test]]
name = "equality"
path = "tests/equality.rs"
required-features = ["equality", "locals", "numbers", "objects", "strings"]

[[test]]
name = "logical-operations"
path = "tests/logical_operations.rs"
required-features = ["function-arguments", "logical-operations"]

[[test]]
name = "objects"
path = "tests/objects.rs"
required-features = ["objects"]

[[test]]
name = "literal-expressions"
path = "tests/literal_expressions.rs"
required-features = [
  "arrays",
  "constructors",
  "function-arguments",
  "objects",
  "receivers",
]

[[test]]
name = "arrays"
path = "tests/arrays.rs"
required-features = ["arrays"]

[[test]]
name = "array-indexing"
path = "tests/array_indexing.rs"
required-features = ["arrays"]

[[test]]
name = "array-assignment-expressions"
path = "tests/array_assignment_expressions.rs"
required-features = ["array-assignment-expressions", "arrays", "locals"]

[[test]]
name = "captured-array-assignment-expressions"
path = "tests/captured_array_assignment_expressions.rs"
required-features = [
  "array-assignment-expressions",
  "arrays",
  "environments",
  "function-arguments",
  "objects",
]

[[test]]
name = "receiver-array-assignment-expressions"
path = "tests/receiver_array_assignment_expressions.rs"
required-features = [
  "array-assignment-expressions",
  "class-methods",
  "construction",
  "property-assignment",
]

[[test]]
name = "numbers"
path = "tests/numbers.rs"
required-features = ["locals", "number-coercion", "number-negation", "number-operations"]

[[test]]
name = "string-number-coercion"
path = "tests/string_number_coercion.rs"
required-features = ["number-negation", "string-number-coercion"]

[[test]]
name = "typeof"
path = "tests/typeof.rs"
required-features = ["functions", "numbers", "objects", "typeof"]

[[test]]
name = "constructors"
path = "tests/constructors.rs"
required-features = ["constructors", "equality", "locals", "objects", "typeof"]

[[test]]
name = "construction"
path = "tests/construction.rs"
required-features = [
  "construction",
  "environments",
  "equality",
  "instanceof",
  "locals",
  "objects",
  "property-assignment",
]

[[test]]
name = "classes"
path = "tests/classes.rs"
required-features = ["classes", "instanceof", "locals", "objects", "typeof"]

[[test]]
name = "class-methods"
path = "tests/class_methods.rs"
required-features = ["class-methods", "locals", "objects"]

[[test]]
name = "class-expressions"
path = "tests/class_expressions.rs"
required-features = ["class-expressions", "locals", "objects"]

[[test]]
name = "recursive-constructors"
path = "tests/recursive_constructors.rs"
required-features = [
  "construction",
  "equality",
  "locals",
  "objects",
  "recursive-constructors",
]

[[test]]
name = "symbols"
path = "tests/symbols.rs"
required-features = ["objects", "symbols"]

[[test]]
name = "iteration"
path = "tests/iteration.rs"
required-features = [
  "array-iterators",
  "collection-iterators",
  "iterator-results",
]
