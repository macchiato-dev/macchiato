[package]
name = "microesnext"
description = "A compact JavaScript engine with explicit removable capabilities"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
control-flow = [
  "microesnext-vm/control-flow",
  "microesnext-compiler/control-flow",
  "microesnext-compiler/conditional-expressions",
]
abstract-equality = [
  "equality",
  "logical-operations",
  "microesnext-vm/abstract-equality",
  "microesnext-compiler/abstract-equality",
]
bitwise-operations = [
  "microesnext-vm/bitwise-operations",
  "microesnext-compiler/bitwise-operations",
]
expression-statements = ["stack-operations", "microesnext-compiler/expression-statements"]
for-statements = [
  "control-flow",
  "expression-statements",
  "locals",
  "microesnext-compiler/for-statements",
]
implicit-completions = ["microesnext-compiler/implicit-completions"]
constructors = [
  "callable-objects",
  "microesnext-vm/constructors",
  "microesnext-compiler/constructors",
]
default-parameters = [
  "control-flow",
  "equality",
  "function-arguments",
  "microesnext-compiler/default-parameters",
]
class-constructors = [
  "constructors",
  "microesnext-objects/class-constructors",
  "microesnext-semantics?/class-constructors",
  "microesnext-vm/class-constructors",
]
construction = [
  "constructors",
  "receivers",
  "microesnext-objects/construction",
  "microesnext-vm/construction",
  "microesnext-compiler/construction",
]
compound-assignment-expressions = [
  "captured-assignment-expressions",
  "local-assignment-expressions",
  "number-coercion",
  "number-operations",
  "microesnext-compiler/compound-assignment-expressions",
]
classes = [
  "class-constructors",
  "construction",
  "property-assignment",
  "microesnext-compiler/classes",
  "microesnext-compiler/class-default-constructors",
]
method-calls = [
  "callable-objects",
  "function-arguments",
  "objects",
  "receivers",
  "microesnext-objects/method-calls",
  "microesnext-vm/method-calls",
  "microesnext-compiler/method-calls",
]
class-methods = ["classes", "method-calls", "microesnext-compiler/class-methods"]
class-static-methods = ["class-methods", "microesnext-compiler/class-static-methods"]
class-expressions = [
  "class-static-methods",
  "stack-operations",
  "microesnext-compiler/class-expressions",
]
class-inheritance = [
  "class-expressions",
  "environments",
  "microesnext-objects/class-inheritance",
  "microesnext-vm/class-inheritance",
  "microesnext-compiler/class-inheritance",
]
class-getters = [
  "class-expressions",
  "microesnext-objects/getters",
  "microesnext-vm/getters",
  "microesnext-compiler/class-getters",
]
named-class-expressions = [
  "class-expressions",
  "captured-assignment-expressions",
  "microesnext-compiler/named-class-expressions",
]
locals = [
  "dep:microesnext-bindings",
  "microesnext-bindings/locals",
  "microesnext-vm/locals",
  "microesnext-compiler/locals",
]
var-declarations = ["locals", "microesnext-compiler/var-declarations"]
local-assignment-expressions = [
  "locals",
  "stack-operations",
  "microesnext-compiler/local-assignment-expressions",
]
update-expressions = [
  "local-assignment-expressions",
  "number-coercion",
  "number-operations",
  "microesnext-compiler/update-expressions",
]
arrays = [
  "dep:microesnext-objects",
  "microesnext-objects/arrays",
  "microesnext-vm/arrays",
  "microesnext-compiler/arrays",
  "microesnext-compiler/array-indexing",
]
array-assignment-expressions = [
  "arrays",
  "microesnext-objects/array-assignment-expressions",
  "microesnext-vm/array-assignment-expressions",
  "microesnext-compiler/array-assignment-expressions",
  "microesnext-compiler/literal-expressions",
]
array-destructuring-assignments = [
  "arrays",
  "local-assignment-expressions",
  "stack-operations",
  "microesnext-compiler/array-destructuring-assignments",
]
array-iterators = [
  "arrays",
  "iterators",
  "microesnext-objects/array-iterators",
  "microesnext-vm/array-iterators",
]
for-of-statements = [
  "array-iterators",
  "for-statements",
  "microesnext-compiler/for-of-statements",
]
async = [
  "dep:microesnext-scheduler",
  "microesnext-scheduler/async",
  "microesnext-compiler/async",
]
async-functions = [
  "async",
  "functions",
  "promises",
  "promise-resolution",
  "microesnext-execution/async-functions",
  "microesnext-scheduler/functions",
  "microesnext-vm/async-functions",
  "microesnext-semantics?/async-functions",
  "microesnext-compiler/async-functions",
]
async-thenables = [
  "async-functions",
  "thenables",
  "microesnext-scheduler/async-thenables",
]
strings = [
  "dep:microesnext-values",
  "microesnext-values/strings",
  "microesnext-vm/strings",
  "microesnext-objects?/collection-string-keys",
  "microesnext-semantics?/string-values",
  "microesnext-compiler/strings",
]
stack-operations = [
  "microesnext-arena/stack-operations",
  "microesnext-vm/stack-operations",
]
string-operations = [
  "strings",
  "microesnext-vm/string-operations",
  "microesnext-compiler/string-operations",
]
template-literals = [
  "strings",
  "string-operations",
  "microesnext-compiler/template-literals",
]
symbols = ["dep:microesnext-values", "microesnext-values/symbols", "microesnext-semantics?/symbols"]
well-known-symbols = ["symbols"]
atoms = ["strings", "microesnext-vm/atoms"]
objects = [
  "dep:microesnext-objects",
  "atoms",
  "microesnext-vm/objects",
  "microesnext-compiler/objects",
]
literal-expressions = [
  "arrays",
  "objects",
  "microesnext-compiler/literal-expressions",
]
property-assignment = [
  "objects",
  "microesnext-vm/property-assignment",
  "microesnext-compiler/property-assignment",
]
prototype-chain = ["objects", "microesnext-objects/prototype-chain"]
functions = [
  "microesnext-arena/closures",
  "microesnext-vm/functions",
  "microesnext-compiler/functions",
]
host-bindings = [
  "microesnext-vm/host-bindings",
  "microesnext-compiler/host-bindings",
  "microesnext-scheduler?/host-bindings",
]
callable-objects = [
  "functions",
  "objects",
  "microesnext-objects/callable-objects",
  "microesnext-vm/callable-objects",
  "microesnext-semantics?/callable-objects",
]
function-arguments = [
  "functions",
  "locals",
  "microesnext-bindings/parameters",
  "microesnext-vm/function-arguments",
  "microesnext-compiler/function-arguments",
]
integer-operations = [
  "dep:microesnext-semantics",
  "microesnext-semantics/integer-operations",
  "microesnext-vm/integer-operations",
  "microesnext-compiler/integer-operations",
]
integer-negation = [
  "dep:microesnext-semantics",
  "microesnext-semantics/integer-operations",
  "microesnext-vm/integer-negation",
  "microesnext-compiler/integer-negation",
]
instanceof = [
  "callable-objects",
  "microesnext-objects/instanceof",
  "microesnext-vm/instanceof",
  "microesnext-compiler/instanceof",
]
minimal-program = ["control-flow", "integer-operations", "locals"]
equality = [
  "dep:microesnext-semantics",
  "microesnext-semantics/equality",
  "microesnext-vm/equality",
  "microesnext-compiler/equality",
]
logical-operations = [
  "dep:microesnext-semantics",
  "microesnext-semantics/logical-operations",
  "microesnext-vm/logical-operations",
  "microesnext-compiler/logical-operations",
]
numbers = [
  "dep:microesnext-values",
  "microesnext-values/numbers",
  "microesnext-vm/numbers",
  "microesnext-objects?/collection-number-keys",
  "microesnext-semantics?/numbers",
  "microesnext-compiler/numbers",
]
number-operations = [
  "numbers",
  "integer-operations",
  "microesnext-vm/number-operations",
  "microesnext-compiler/number-operations",
]
number-negation = [
  "numbers",
  "integer-negation",
  "microesnext-vm/number-negation",
  "microesnext-compiler/number-negation",
]
number-coercion = [
  "numbers",
  "microesnext-vm/number-coercion",
  "microesnext-compiler/number-coercion",
]
number-division = [
  "numbers",
  "microesnext-vm/number-division",
  "microesnext-compiler/number-division",
]
number-remainder = [
  "numbers",
  "microesnext-vm/number-remainder",
  "microesnext-compiler/number-remainder",
]
nonterminal-conditionals = ["control-flow", "microesnext-compiler/nonterminal-conditionals"]
nonterminal-exceptions = [
  "control-flow",
  "exceptions",
  "microesnext-compiler/nonterminal-exceptions",
]
nested-conditionals = [
  "nonterminal-conditionals",
  "microesnext-compiler/nested-conditionals",
]
nested-loops = ["nested-conditionals", "microesnext-compiler/nested-loops"]
nested-exceptions = [
  "nonterminal-exceptions",
  "microesnext-compiler/nested-exceptions",
]
structured-statements = [
  "nested-exceptions",
  "nested-loops",
  "microesnext-compiler/structured-statements",
]
string-number-coercion = [
  "number-coercion",
  "strings",
  "microesnext-values/string-coercion",
  "microesnext-vm/string-number-coercion",
  "microesnext-compiler/string-number-coercion",
]
typeof = [
  "strings",
  "dep:microesnext-semantics",
  "microesnext-semantics/typeof",
  "microesnext-vm/typeof",
  "microesnext-compiler/typeof",
]
exceptions = [
  "microesnext-execution/exceptions",
  "microesnext-vm/exceptions",
  "microesnext-compiler/exceptions",
]
errors = ["dep:microesnext-values", "microesnext-values/errors"]
environments = [
  "microesnext-bindings/environments",
  "microesnext-vm/environments",
  "microesnext-compiler/environments",
]
captured-assignment-expressions = [
  "environments",
  "microesnext-bindings/assignment-expressions",
  "microesnext-vm/captured-assignment-expressions",
  "microesnext-compiler/captured-assignment-expressions",
]
property-assignment-expressions = [
  "objects",
  "microesnext-objects/assignment-expressions",
  "microesnext-vm/property-assignment-expressions",
  "microesnext-compiler/property-assignment-expressions",
]
recursive-functions = [
  "functions",
  "environments",
  "microesnext-bindings/recursive-functions",
  "microesnext-vm/recursive-functions",
  "microesnext-compiler/recursive-functions",
]
recursive-constructors = [
  "constructors",
  "recursive-functions",
  "microesnext-objects/recursive-constructors",
  "microesnext-vm/recursive-constructors",
  "microesnext-compiler/recursive-constructors",
]
recursive-async-functions = [
  "async-functions",
  "environments",
  "microesnext-execution/recursive-async-functions",
  "microesnext-vm/recursive-async-functions",
  "microesnext-compiler/recursive-async-functions",
]
receivers = [
  "function-arguments",
  "microesnext-bindings/receivers",
  "microesnext-vm/receivers",
  "microesnext-compiler/receivers",
]
collections = ["dep:microesnext-objects", "microesnext-objects/collections"]
collection-iterators = ["collections", "iterators", "microesnext-objects/collection-iterators"]
collection-entry-iterators = [
  "arrays",
  "collections",
  "iterators",
  "microesnext-objects/collection-entry-iterators",
]
iterators = ["dep:microesnext-objects", "microesnext-objects/iterators"]
iterator-results = [
  "atoms",
  "microesnext-objects/iterator-results",
  "dep:microesnext-objects",
]
iterable-protocol = [
  "microesnext-objects/iterator-protocol",
  "dep:microesnext-objects",
  "well-known-symbols",
]
weak-collections = ["collections", "microesnext-objects/weak-collections"]
promises = ["microesnext-execution/promises"]
promise-resolution = [
  "promises",
  "microesnext-execution/promise-resolution",
]
promise-resolvers = [
  "promise-resolution",
  "microesnext-execution/promise-resolvers",
  "microesnext-vm/promise-resolvers",
  "microesnext-semantics?/promise-resolvers",
]
thenables = [
  "objects",
  "promise-resolvers",
  "receivers",
  "dep:microesnext-scheduler",
  "microesnext-scheduler/thenables",
]
promise-jobs = [
  "async",
  "functions",
  "promise-resolution",
  "microesnext-scheduler/resolution",
]

[dependencies]
microesnext-arena.workspace = true
microesnext-scheduler = { workspace = true, optional = true }
microesnext-execution = { workspace = true, features = ["core"] }
microesnext-bindings = { workspace = true, optional = true }
microesnext-semantics = { workspace = true, optional = true }
microesnext-objects = { workspace = true, optional = true }
microesnext-values = { workspace = true, optional = true }
microesnext-bytecode.workspace = true
microesnext-types.workspace = true
microesnext-vm.workspace = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
microesnext-compiler = { path = "../microesnext-compiler", default-features = false }

[[test]]
name = "source"
path = "tests/source.rs"
required-features = ["async", "exceptions", "locals"]

[[test]]
name = "source_strings"
path = "tests/source_strings.rs"
required-features = ["strings"]

[[test]]
name = "template-literals"
path = "tests/template_literals.rs"
required-features = ["template-literals", "locals"]

[[test]]
name = "array-destructuring-assignments"
path = "tests/array_destructuring_assignments.rs"
required-features = ["array-destructuring-assignments", "arrays", "locals"]

[[test]]
name = "hoisted-var-declarations"
path = "tests/hoisted_var_declarations.rs"
required-features = [
  "environments",
  "functions",
  "local-assignment-expressions",
  "var-declarations",
]

[[test]]
name = "source_logical"
path = "tests/source_logical.rs"
