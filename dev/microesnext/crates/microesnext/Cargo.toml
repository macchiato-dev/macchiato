  "compound-assignment-expressions",
  "class-expressions",
  "for-of-statements",
  "for-statements",
  "update-expressions",
]

[[test]]
name = "bitwise-operations"
path = "tests/bitwise_operations.rs"
required-features = ["bitwise-operations", "integer-operations"]

[[test]]
name = "abstract-equality"
path = "tests/abstract_equality.rs"
required-features = ["abstract-equality"]

[[test]]
name = "default-parameters"
path = "tests/default_parameters.rs"
