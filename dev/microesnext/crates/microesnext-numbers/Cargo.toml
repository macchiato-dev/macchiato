[package]
name = "microesnext-numbers"
description = "Optional heap-backed numeric values for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
operations = []
remainder = []
string-coercion = ["dep:microesnext-decimal-to-f64"]

[dependencies]
microesnext-arena = { workspace = true, features = ["numbers"] }
microesnext-decimal-to-f64 = { workspace = true, optional = true }
microesnext-types.workspace = true

[lib]
path = "src/lib.rs"
