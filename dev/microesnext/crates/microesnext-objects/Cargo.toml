[package]
name = "microesnext-objects"
description = "Compact ordinary objects for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
callable-objects = ["microesnext-arena/callable-objects"]
class-constructors = ["microesnext-arena/class-constructors"]

[dependencies]
microesnext-arena.workspace = true
microesnext-types.workspace = true

[dev-dependencies]
microesnext-atoms.workspace = true

[lib]
path = "src/lib.rs"
