[package]
name = "microesnext-objects"
description = "Compact ordinary objects for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
callable-objects = ["microesnext-arena/callable-objects", "microesnext-arena/closures"]
class-constructors = ["microesnext-arena/class-constructors", "microesnext-arena/closures"]
construction = ["callable-objects"]
instanceof = ["callable-objects", "prototype-chain"]
assignment-expressions = []
method-calls = ["dep:microesnext-bindings", "microesnext-bindings/parameters"]
prototype-chain = []
recursive-constructors = ["callable-objects", "dep:microesnext-bindings", "microesnext-bindings/environments"]

[dependencies]
microesnext-arena.workspace = true
microesnext-bindings = { workspace = true, optional = true }
microesnext-types.workspace = true

[dev-dependencies]
microesnext-bindings = { workspace = true, features = ["recursive-functions"] }
microesnext-strings.workspace = true

[lib]
path = "src/lib.rs"
