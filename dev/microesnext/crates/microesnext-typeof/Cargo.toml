[package]
name = "microesnext-typeof"
description = "Removable JavaScript typeof classification for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
async-functions = ["microesnext-arena/async-functions"]
callable-objects = ["microesnext-arena/callable-objects"]
class-constructors = ["microesnext-arena/class-constructors"]
numbers = ["microesnext-arena/numbers"]
promise-resolvers = ["microesnext-arena/promise-resolvers"]
symbols = ["microesnext-arena/symbols"]

[dependencies]
microesnext-arena = { workspace = true, features = ["closures"] }
microesnext-strings.workspace = true
microesnext-types.workspace = true

[dev-dependencies]
microesnext-callable-objects.workspace = true

[lib]
path = "src/lib.rs"
