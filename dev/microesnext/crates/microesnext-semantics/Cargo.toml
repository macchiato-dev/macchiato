[package]
name = "microesnext-semantics"
description = "Composable JavaScript value semantics for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
equality = []
abstract-equality = ["equality"]
integer-operations = []
bitwise-operations = []
logical-operations = ["truthiness"]
numbers = ["dep:microesnext-values", "microesnext-values/numbers"]
string-values = []
truthiness = []
typeof = ["dep:microesnext-values", "microesnext-values/strings", "microesnext-arena/closures"]
async-functions = ["microesnext-arena/async-functions"]
callable-objects = ["microesnext-arena/callable-objects"]
class-constructors = ["microesnext-arena/class-constructors"]
promise-resolvers = ["microesnext-arena/promise-resolvers"]
symbols = ["microesnext-arena/symbols"]

[dependencies]
microesnext-arena.workspace = true
microesnext-values = { workspace = true, optional = true }
microesnext-types.workspace = true

[dev-dependencies]
microesnext-objects = { workspace = true, features = ["callable-objects"] }
microesnext-values = { workspace = true, features = ["numbers", "strings"] }

[lib]
path = "src/lib.rs"
