[package]
name = "microesnext-promises"
description = "Optional Promise state and rooted FIFO jobs for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
resolution = ["dep:microesnext-errors"]
resolvers = ["resolution", "microesnext-arena/promise-resolvers"]

[dependencies]
microesnext-arena.workspace = true
microesnext-errors = { workspace = true, optional = true }
microesnext-types.workspace = true

[dev-dependencies]
microesnext-objects.workspace = true

[lib]
path = "src/lib.rs"
