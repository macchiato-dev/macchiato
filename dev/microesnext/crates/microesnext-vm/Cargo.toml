[package]
name = "microesnext-vm"
description = "Small synchronous MicroESNext bytecode machine"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
control-flow = ["dep:microesnext-truthiness", "microesnext-bytecode/control-flow"]
locals = ["dep:microesnext-locals", "microesnext-bytecode/locals"]
async = ["dep:microesnext-suspension", "microesnext-bytecode/async"]
async-functions = [
  "async",
  "functions",
  "dep:microesnext-async-functions",
  "microesnext-bytecode/async-functions",
  "microesnext-typeof?/async-functions",
]
arrays = ["dep:microesnext-arrays", "microesnext-bytecode/arrays"]
strings = [
  "dep:microesnext-strings",
  "microesnext-bytecode/strings",
  "microesnext-equality?/strings",
  "microesnext-logical-operations?/strings",
  "microesnext-truthiness?/strings",
]
string-operations = [
  "strings",
  "dep:microesnext-string-operations",
  "microesnext-bytecode/string-operations",
]
atoms = ["dep:microesnext-atoms", "strings", "microesnext-bytecode/atoms"]
objects = ["dep:microesnext-objects", "atoms", "microesnext-bytecode/objects"]
property-assignment = ["objects", "microesnext-bytecode/property-assignment"]
functions = ["dep:microesnext-functions", "microesnext-bytecode/functions"]
callable-objects = [
  "functions",
  "objects",
  "dep:microesnext-callable-objects",
  "microesnext-typeof?/callable-objects",
]
constructors = ["callable-objects", "microesnext-bytecode/constructors"]
class-constructors = [
  "constructors",
  "dep:microesnext-class-constructors",
  "microesnext-bytecode/class-constructors",
  "microesnext-construction?/class-constructors",
  "microesnext-instanceof?/class-constructors",
  "microesnext-typeof?/class-constructors",
]
construction = [
  "constructors",
  "receivers",
  "dep:microesnext-construction",
  "microesnext-bytecode/construction",
]
function-arguments = [
  "functions",
  "locals",
  "dep:microesnext-parameters",
  "microesnext-bytecode/function-arguments",
]
integer-operations = [
  "dep:microesnext-integer-operations",
  "microesnext-bytecode/integer-operations",
]
integer-negation = [
  "dep:microesnext-integer-negation",
  "microesnext-bytecode/integer-negation",
]
instanceof = [
  "callable-objects",
  "dep:microesnext-instanceof",
  "dep:microesnext-prototype-chain",
  "microesnext-bytecode/instanceof",
]
equality = ["dep:microesnext-equality", "microesnext-bytecode/equality"]
logical-operations = [
  "dep:microesnext-logical-operations",
  "microesnext-bytecode/logical-operations",
]
method-calls = [
  "callable-objects",
  "function-arguments",
  "objects",
  "receivers",
  "dep:microesnext-method-calls",
  "microesnext-bytecode/method-calls",
]
numbers = [
  "dep:microesnext-numbers",
  "microesnext-bytecode/numbers",
  "microesnext-equality?/numbers",
  "microesnext-logical-operations?/numbers",
  "microesnext-truthiness?/numbers",
  "microesnext-typeof?/numbers",
]
number-operations = [
  "numbers",
  "integer-operations",
  "dep:microesnext-number-operations",
  "microesnext-bytecode/number-operations",
]
number-negation = [
  "numbers",
  "integer-negation",
  "dep:microesnext-number-negation",
  "microesnext-bytecode/number-negation",
]
number-coercion = [
  "numbers",
  "dep:microesnext-number-coercion",
  "microesnext-bytecode/number-coercion",
]
number-division = [
  "numbers",
  "dep:microesnext-number-division",
  "microesnext-bytecode/number-division",
]
number-remainder = [
  "numbers",
  "dep:microesnext-number-remainder",
  "microesnext-bytecode/number-remainder",
]
string-number-coercion = [
  "number-coercion",
  "strings",
  "dep:microesnext-string-number-coercion",
]
exceptions = ["dep:microesnext-exceptions", "microesnext-bytecode/exceptions"]
environments = ["dep:microesnext-environments", "microesnext-bytecode/environments"]
recursive-functions = [
  "functions",
  "environments",
  "dep:microesnext-recursive-functions",
  "microesnext-bytecode/recursive-functions",
]
recursive-constructors = [
  "constructors",
  "recursive-functions",
  "dep:microesnext-recursive-constructors",
  "microesnext-bytecode/recursive-constructors",
]
recursive-async-functions = [
  "async-functions",
  "environments",
  "dep:microesnext-recursive-async-functions",
  "microesnext-bytecode/recursive-async-functions",
]
receivers = [
  "function-arguments",
  "dep:microesnext-receivers",
  "microesnext-bytecode/receivers",
]
promise-resolvers = [
  "function-arguments",
  "dep:microesnext-promise-resolvers",
  "microesnext-typeof?/promise-resolvers",
]
typeof = ["strings", "dep:microesnext-typeof", "microesnext-bytecode/typeof"]

[dependencies]
microesnext-arena.workspace = true
microesnext-bytecode.workspace = true
microesnext-types.workspace = true
microesnext-vm-core.workspace = true
microesnext-arrays = { workspace = true, optional = true }
microesnext-callable-objects = { workspace = true, optional = true }
microesnext-class-constructors = { workspace = true, optional = true }
microesnext-construction = { workspace = true, optional = true }
microesnext-atoms = { workspace = true, optional = true }
microesnext-objects = { workspace = true, optional = true }
microesnext-functions = { workspace = true, optional = true }
microesnext-parameters = { workspace = true, optional = true }
microesnext-locals = { workspace = true, optional = true }
microesnext-logical-operations = { workspace = true, optional = true }
microesnext-method-calls = { workspace = true, optional = true }
microesnext-integer-operations = { workspace = true, optional = true }
microesnext-integer-negation = { workspace = true, optional = true }
microesnext-instanceof = { workspace = true, optional = true }
microesnext-numbers = { workspace = true, optional = true }
microesnext-number-operations = { workspace = true, optional = true }
microesnext-number-negation = { workspace = true, optional = true }
microesnext-number-coercion = { workspace = true, optional = true }
microesnext-number-division = { workspace = true, optional = true }
microesnext-number-remainder = { workspace = true, optional = true }
microesnext-string-number-coercion = { workspace = true, optional = true }
microesnext-exceptions = { workspace = true, optional = true }
microesnext-environments = { workspace = true, optional = true }
microesnext-equality = { workspace = true, optional = true }
microesnext-recursive-functions = { workspace = true, optional = true }
microesnext-recursive-constructors = { workspace = true, optional = true }
microesnext-recursive-async-functions = { workspace = true, optional = true }
microesnext-receivers = { workspace = true, optional = true }
microesnext-promise-resolvers = { workspace = true, optional = true }
microesnext-prototype-chain = { workspace = true, optional = true }
microesnext-suspension = { workspace = true, optional = true }
microesnext-async-functions = { workspace = true, optional = true }
microesnext-strings = { workspace = true, optional = true }
microesnext-string-operations = { workspace = true, optional = true }
microesnext-truthiness = { workspace = true, optional = true }
microesnext-typeof = { workspace = true, optional = true }

[dev-dependencies]
microesnext-compiler.workspace = true
microesnext-promises.workspace = true

[lib]
path = "src/lib.rs"
