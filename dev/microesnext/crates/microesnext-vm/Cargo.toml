[package]
name = "microesnext-vm"
description = "Small synchronous MicroESNext bytecode machine"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
async = []
arrays = ["dep:microesnext-arrays"]
objects = ["dep:microesnext-objects"]
functions = ["dep:microesnext-functions"]
exceptions = []

[dependencies]
microesnext-arena.workspace = true
microesnext-bytecode.workspace = true
microesnext-types.workspace = true
microesnext-vm-core.workspace = true
microesnext-arrays = { workspace = true, optional = true }
microesnext-objects = { workspace = true, optional = true }
microesnext-functions = { workspace = true, optional = true }

[dev-dependencies]
microesnext-compiler.workspace = true

[lib]
path = "src/lib.rs"
