[package]
name = "microesnext-vm"
description = "Small synchronous MicroESNext bytecode machine"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
control-flow = ["dep:microesnext-truthiness", "microesnext-bytecode/control-flow"]
locals = ["dep:microesnext-locals", "microesnext-bytecode/locals"]
async = ["dep:microesnext-suspension", "microesnext-bytecode/async"]
arrays = ["dep:microesnext-arrays", "microesnext-bytecode/arrays"]
strings = [
  "dep:microesnext-strings",
  "microesnext-bytecode/strings",
  "microesnext-truthiness?/strings",
]
atoms = ["dep:microesnext-atoms", "strings", "microesnext-bytecode/atoms"]
objects = ["dep:microesnext-objects", "atoms", "microesnext-bytecode/objects"]
functions = ["dep:microesnext-functions", "microesnext-bytecode/functions"]
numbers = [
  "dep:microesnext-numbers",
  "microesnext-bytecode/numbers",
  "microesnext-truthiness?/numbers",
]
exceptions = ["dep:microesnext-exceptions", "microesnext-bytecode/exceptions"]

[dependencies]
microesnext-arena.workspace = true
microesnext-bytecode.workspace = true
microesnext-types.workspace = true
microesnext-vm-core.workspace = true
microesnext-arrays = { workspace = true, optional = true }
microesnext-atoms = { workspace = true, optional = true }
microesnext-objects = { workspace = true, optional = true }
microesnext-functions = { workspace = true, optional = true }
microesnext-locals = { workspace = true, optional = true }
microesnext-numbers = { workspace = true, optional = true }
microesnext-exceptions = { workspace = true, optional = true }
microesnext-suspension = { workspace = true, optional = true }
microesnext-strings = { workspace = true, optional = true }
microesnext-truthiness = { workspace = true, optional = true }

[dev-dependencies]
microesnext-compiler.workspace = true

[lib]
path = "src/lib.rs"
