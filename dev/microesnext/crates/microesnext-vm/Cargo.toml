[package]
name = "microesnext-vm"
description = "Small synchronous MicroESNext bytecode machine"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
control-flow = [
  "dep:microesnext-semantics",
  "microesnext-semantics/truthiness",
  "microesnext-bytecode/control-flow",
]
locals = ["dep:microesnext-bindings", "microesnext-bindings/locals", "microesnext-bytecode/locals"]
async = [
  "microesnext-execution/suspension",
  "microesnext-bytecode/async",
]
async-functions = [
  "async",
  "functions",
  "microesnext-execution/async-functions",
  "microesnext-bytecode/async-functions",
  "microesnext-semantics?/async-functions",
]
arrays = ["dep:microesnext-objects", "microesnext-objects/arrays", "microesnext-bytecode/arrays"]
strings = [
  "dep:microesnext-values",
  "microesnext-values/strings",
  "microesnext-bytecode/strings",
  "microesnext-semantics?/string-values",
]
stack-operations = [
  "microesnext-arena/stack-operations",
  "microesnext-bytecode/stack-operations",
]
string-operations = [
  "strings",
  "microesnext-bytecode/string-operations",
]
atoms = ["strings", "microesnext-bytecode/atoms"]
objects = ["dep:microesnext-objects", "atoms", "microesnext-bytecode/objects"]
property-assignment = ["objects", "microesnext-bytecode/property-assignment"]
functions = ["microesnext-arena/closures", "microesnext-bytecode/functions"]
host-bindings = ["microesnext-bytecode/host-bindings"]
callable-objects = [
  "functions",
  "objects",
  "microesnext-objects/callable-objects",
  "microesnext-semantics?/callable-objects",
]
constructors = ["callable-objects", "microesnext-bytecode/constructors"]
class-constructors = [
  "constructors",
  "microesnext-objects/class-constructors",
  "microesnext-bytecode/class-constructors",
  "microesnext-semantics?/class-constructors",
]
construction = [
  "constructors",
  "receivers",
  "microesnext-objects/construction",
  "microesnext-bytecode/construction",
]
function-arguments = [
  "functions",
  "locals",
  "microesnext-bindings/parameters",
  "microesnext-bytecode/function-arguments",
]
integer-operations = [
  "dep:microesnext-semantics",
  "microesnext-semantics/integer-operations",
  "microesnext-bytecode/integer-operations",
]
bitwise-operations = [
  "dep:microesnext-semantics",
  "microesnext-semantics/bitwise-operations",
  "microesnext-bytecode/bitwise-operations",
]
integer-negation = [
  "dep:microesnext-semantics",
  "microesnext-semantics/integer-operations",
  "microesnext-bytecode/integer-negation",
]
instanceof = [
  "callable-objects",
  "microesnext-objects/instanceof",
  "microesnext-bytecode/instanceof",
]
equality = [
  "dep:microesnext-semantics",
  "microesnext-semantics/equality",
  "microesnext-bytecode/equality",
]
abstract-equality = [
  "equality",
  "microesnext-semantics/abstract-equality",
  "microesnext-bytecode/abstract-equality",
]
logical-operations = [
  "dep:microesnext-semantics",
  "microesnext-semantics/logical-operations",
  "microesnext-bytecode/logical-operations",
]
method-calls = [
  "callable-objects",
  "function-arguments",
  "objects",
  "receivers",
  "microesnext-objects/method-calls",
  "microesnext-bytecode/method-calls",
]
numbers = [
  "dep:microesnext-values",
  "microesnext-values/numbers",
  "microesnext-bytecode/numbers",
  "microesnext-semantics?/numbers",
]
number-operations = [
  "numbers",
  "integer-operations",
  "microesnext-bytecode/number-operations",
]
number-negation = [
  "numbers",
  "integer-negation",
  "microesnext-bytecode/number-negation",
]
number-coercion = [
  "numbers",
  "microesnext-bytecode/number-coercion",
]
number-division = [
  "numbers",
  "microesnext-bytecode/number-division",
]
number-remainder = [
  "numbers",
  "microesnext-bytecode/number-remainder",
]
string-number-coercion = [
  "number-coercion",
  "strings",
  "microesnext-values/string-coercion",
]
exceptions = [
  "microesnext-execution/exceptions",
  "microesnext-bytecode/exceptions",
]
environments = ["dep:microesnext-bindings", "microesnext-bindings/environments", "microesnext-bytecode/environments"]
captured-assignment-expressions = [
  "environments",
  "microesnext-bindings/assignment-expressions",
  "microesnext-bytecode/captured-assignment-expressions",
]
array-assignment-expressions = [
  "arrays",
  "microesnext-objects/array-assignment-expressions",
  "microesnext-bytecode/array-assignment-expressions",
]
property-assignment-expressions = [
  "objects",
  "microesnext-objects/assignment-expressions",
  "microesnext-bytecode/property-assignment-expressions",
]
recursive-functions = [
  "functions",
  "environments",
  "microesnext-bindings/recursive-functions",
  "microesnext-bytecode/recursive-functions",
]
recursive-constructors = [
  "constructors",
  "recursive-functions",
  "microesnext-objects/recursive-constructors",
  "microesnext-bytecode/recursive-constructors",
]
recursive-async-functions = [
  "async-functions",
  "environments",
  "microesnext-execution/recursive-async-functions",
  "microesnext-bytecode/recursive-async-functions",
]
receivers = [
  "function-arguments",
  "microesnext-bindings/receivers",
  "microesnext-bytecode/receivers",
]
promise-resolvers = [
  "function-arguments",
  "microesnext-execution/promise-resolvers",
  "microesnext-semantics?/promise-resolvers",
]
typeof = [
  "strings",
  "dep:microesnext-semantics",
  "microesnext-semantics/typeof",
  "microesnext-bytecode/typeof",
]

[dependencies]
microesnext-arena.workspace = true
microesnext-bytecode.workspace = true
microesnext-types.workspace = true
microesnext-objects = { workspace = true, optional = true }
microesnext-bindings = { workspace = true, optional = true }
microesnext-semantics = { workspace = true, optional = true }
microesnext-execution = { workspace = true, features = ["core"] }
microesnext-values = { workspace = true, optional = true }

[dev-dependencies]
microesnext-compiler.workspace = true

[lib]
path = "src/lib.rs"
