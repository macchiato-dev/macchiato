[package]
name = "microesnext-construction"
description = "Removable ordinary instance construction for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
class-constructors = [
  "microesnext-objects/class-constructors",
]

[dependencies]
microesnext-arena = { workspace = true, features = ["closures"] }
microesnext-objects = { workspace = true, features = ["callable-objects"] }
microesnext-types.workspace = true

[lib]
path = "src/lib.rs"
