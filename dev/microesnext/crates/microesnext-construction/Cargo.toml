[package]
name = "microesnext-construction"
description = "Removable ordinary instance construction for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
class-constructors = [
  "dep:microesnext-class-constructors",
  "microesnext-objects/class-constructors",
]

[dependencies]
microesnext-arena = { workspace = true, features = ["closures"] }
microesnext-callable-objects.workspace = true
microesnext-class-constructors = { workspace = true, optional = true }
microesnext-objects.workspace = true
microesnext-types.workspace = true

[dev-dependencies]
microesnext-class-constructors.workspace = true

[lib]
path = "src/lib.rs"
