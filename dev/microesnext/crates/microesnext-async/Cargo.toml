[package]
name = "microesnext-async"
description = "Optional async scheduling types for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
promises = ["dep:microesnext-arena", "dep:microesnext-promises", "microesnext-vm/functions"]
resolution = ["promises", "microesnext-promises/resolution"]
functions = [
  "resolution",
  "dep:microesnext-execution",
  "microesnext-execution/async-functions",
  "microesnext-vm/async-functions",
]

[dependencies]
microesnext-types.workspace = true
microesnext-vm = { workspace = true, features = ["async"] }
microesnext-promises = { workspace = true, optional = true }
microesnext-arena = { workspace = true, optional = true }
microesnext-execution = { workspace = true, optional = true }

[dev-dependencies]
microesnext-bytecode.workspace = true
microesnext-arena = { workspace = true, features = ["closures"] }

[lib]
path = "src/lib.rs"
