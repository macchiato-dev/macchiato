[package]
name = "microesnext-thenables"
description = "Optional object thenable assimilation for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
microesnext-arena = { workspace = true, features = ["closures"] }
microesnext-objects.workspace = true
microesnext-promises = { workspace = true, features = ["resolution", "resolvers"] }
microesnext-types.workspace = true
microesnext-vm = { workspace = true, features = [
  "objects",
  "promise-resolvers",
  "receivers",
] }

[dev-dependencies]
microesnext-bytecode.workspace = true
microesnext-compiler.workspace = true

[lib]
path = "src/lib.rs"
