[package]
name = "microesnext-instanceof"
description = "Removable ordinary instanceof semantics for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
class-constructors = [
  "microesnext-arena/class-constructors",
  "microesnext-objects/class-constructors",
]

[dependencies]
microesnext-arena = { workspace = true, features = ["callable-objects", "closures"] }
microesnext-objects = { workspace = true, features = ["callable-objects", "prototype-chain"] }
microesnext-types.workspace = true

[dev-dependencies]

[lib]
path = "src/lib.rs"
