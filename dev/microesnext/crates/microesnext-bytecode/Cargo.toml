[package]
name = "microesnext-bytecode"
description = "Compact bytecode format and builder for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
control-flow = []
locals = []
logical-operations = []
method-calls = ["function-arguments", "objects", "receivers"]
arrays = []
async = []
async-functions = ["async", "functions"]
atoms = ["strings"]
exceptions = []
environments = []
equality = []
abstract-equality = ["equality"]
recursive-functions = ["functions", "environments"]
recursive-constructors = ["constructors", "recursive-functions"]
recursive-async-functions = ["async-functions", "environments"]
receivers = ["function-arguments"]
functions = []
host-bindings = []
function-arguments = ["functions", "locals"]
integer-operations = []
bitwise-operations = []
integer-negation = []
numbers = []
number-operations = ["numbers"]
number-negation = ["integer-negation"]
number-coercion = []
number-division = ["numbers"]
number-remainder = ["numbers"]
objects = ["atoms"]
property-assignment = ["objects"]
strings = []
stack-operations = []
string-operations = ["strings"]
typeof = ["strings"]
instanceof = []
constructors = []
class-constructors = ["constructors"]
class-inheritance = ["class-constructors", "function-arguments", "receivers"]
getters = ["functions", "receivers"]
captured-assignment-expressions = ["environments"]
property-assignment-expressions = ["objects"]
property-update-expressions = ["objects"]
array-assignment-expressions = ["arrays"]
array-update-expressions = ["arrays"]
iterators = []
array-iterators = ["arrays", "iterators"]
construction = ["constructors", "receivers"]

[dependencies]
microesnext-types.workspace = true

[lib]
path = "src/lib.rs"
