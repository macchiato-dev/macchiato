[package]
name = "microesnext-bytecode"
description = "Compact bytecode format and builder for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
control-flow = []
locals = []
arrays = []
async = []
async-functions = ["async", "functions"]
atoms = ["strings"]
exceptions = []
environments = []
equality = []
recursive-functions = ["functions", "environments"]
recursive-async-functions = ["async-functions", "environments"]
receivers = ["function-arguments"]
functions = []
function-arguments = ["functions", "locals"]
integer-operations = []
numbers = []
objects = ["atoms"]
strings = []

[dependencies]
microesnext-bytecode-core.workspace = true
microesnext-types.workspace = true

[lib]
path = "src/lib.rs"
