[package]
name = "microesnext-compiler"
description = "Allocation-using compiler and bytecode tooling for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = [
  "arrays",
  "abstract-equality",
  "bitwise-operations",
  "array-indexing",
  "array-spread",
  "array-assignment-expressions",
  "array-destructuring-assignments",
  "array-destructuring-declarations",
  "array-update-expressions",
  "async-functions",
  "control-flow",
  "conditional-expressions",
  "constructors",
  "default-parameters",
  "construction",
  "class-methods",
  "class-static-methods",
  "class-expressions",
  "class-inheritance",
  "class-getters",
  "named-class-expressions",
  "object-destructuring-declarations",
  "object-destructuring-assignments",
  "property-update-expressions",
  "comments",
  "class-default-constructors",
  "compound-assignment-expressions",
  "captured-assignment-expressions",
  "equality",
  "exceptions",
  "expression-statements",
  "function-arguments",
  "for-statements",
  "for-of-statements",
  "for-in-statements",
  "implicit-completions",
  "host-bindings",
  "instanceof",
  "in-expressions",
  "literal-expressions",
  "local-assignment-expressions",
  "recursive-async-functions",
  "recursive-functions",
  "recursive-constructors",
  "logical-operations",
  "number-negation",
  "number-coercion",
  "number-division",
  "number-remainder",
  "nonterminal-conditionals",
  "nested-conditionals",
  "nested-loops",
  "nested-exceptions",
  "structured-statements",
  "string-number-coercion",
  "template-literals",
  "typeof",
  "update-expressions",
  "var-declarations",
  "void-expressions",
  "number-operations",
  "objects",
  "parenthesized-expressions",
  "property-assignment",
  "property-assignment-expressions",
  "receivers",
  "regexp-literals",
  "rest-parameters",
  "source-positions",
]
arrays = ["microesnext-bytecode/arrays"]
array-spread = ["arrays", "literal-expressions", "microesnext-bytecode/array-spread"]
abstract-equality = [
  "equality",
  "logical-operations",
  "microesnext-bytecode/abstract-equality",
]
bitwise-operations = ["microesnext-bytecode/bitwise-operations"]
array-indexing = ["arrays"]
array-assignment-expressions = [
  "array-indexing",
  "locals",
  "microesnext-bytecode/array-assignment-expressions",
]
array-update-expressions = [
  "array-assignment-expressions",
  "update-expressions",
  "microesnext-bytecode/array-update-expressions",
]
array-destructuring-assignments = [
  "array-indexing",
  "expression-statements",
  "local-assignment-expressions",
  "microesnext-bytecode/stack-operations",
]
array-destructuring-declarations = [
  "array-indexing",
  "locals",
  "microesnext-bytecode/stack-operations",
]
async = ["microesnext-bytecode/async"]
async-functions = [
  "async",
  "functions",
  "microesnext-bytecode/async-functions",
]
atoms = ["strings", "microesnext-bytecode/atoms"]
control-flow = ["microesnext-bytecode/control-flow"]
conditional-expressions = ["control-flow"]
compound-assignment-expressions = [
  "bitwise-operations",
  "captured-assignment-expressions",
  "local-assignment-expressions",
  "number-operations",
  "number-coercion",
]
constructors = ["functions", "microesnext-bytecode/constructors"]
default-parameters = ["control-flow", "equality", "function-arguments"]
construction = ["constructors", "receivers", "microesnext-bytecode/construction"]
classes = [
  "construction",
  "property-assignment",
  "microesnext-bytecode/class-constructors",
]
class-methods = ["classes", "method-calls"]
class-static-methods = ["class-methods"]
class-expressions = [
  "class-default-constructors",
  "class-static-methods",
  "microesnext-bytecode/stack-operations",
]
class-inheritance = [
  "class-expressions",
  "environments",
  "expression-statements",
  "function-arguments",
  "receivers",
  "microesnext-bytecode/class-inheritance",
]
class-getters = ["class-expressions", "microesnext-bytecode/getters"]
named-class-expressions = ["class-expressions", "captured-assignment-expressions"]
comments = []
class-default-constructors = ["classes"]
captured-assignment-expressions = [
  "environments",
  "microesnext-bytecode/captured-assignment-expressions",
]
property-assignment-expressions = [
  "locals",
  "objects",
  "microesnext-bytecode/property-assignment-expressions",
]
property-update-expressions = [
  "property-assignment-expressions",
  "update-expressions",
  "microesnext-bytecode/property-update-expressions",
]
equality = ["microesnext-bytecode/equality"]
exceptions = ["microesnext-bytecode/exceptions"]
expression-statements = ["microesnext-bytecode/stack-operations"]
for-statements = ["control-flow", "expression-statements", "locals"]
for-of-statements = ["arrays", "for-statements", "microesnext-bytecode/array-iterators"]
for-in-statements = ["for-statements", "objects", "microesnext-bytecode/object-key-iterators"]
environments = ["functions", "microesnext-bytecode/environments"]
functions = [
  "locals",
  "microesnext-bytecode/functions",
]
function-arguments = ["functions", "microesnext-bytecode/function-arguments"]
implicit-completions = []
host-bindings = ["microesnext-bytecode/host-bindings"]
integer-operations = ["microesnext-bytecode/integer-operations"]
integer-negation = ["microesnext-bytecode/integer-negation"]
instanceof = ["microesnext-bytecode/instanceof"]
in-expressions = ["objects"]
locals = ["microesnext-bytecode/locals"]
logical-operations = ["microesnext-bytecode/logical-operations"]
literal-expressions = []
local-assignment-expressions = ["locals", "microesnext-bytecode/stack-operations"]
update-expressions = [
  "captured-update-expressions",
  "local-assignment-expressions",
  "number-coercion",
  "number-operations",
]
captured-update-expressions = [
  "environments",
  "microesnext-bytecode/captured-update-expressions",
]
method-calls = [
  "function-arguments",
  "objects",
  "receivers",
  "microesnext-bytecode/method-calls",
]
numbers = ["dep:microesnext-values", "microesnext-values/decimal-to-f64", "microesnext-bytecode/numbers"]
number-operations = [
  "integer-operations",
  "numbers",
  "microesnext-bytecode/number-operations",
]
number-negation = [
  "integer-negation",
  "microesnext-bytecode/number-negation",
]
number-coercion = ["microesnext-bytecode/number-coercion"]
number-division = ["numbers", "microesnext-bytecode/number-division"]
number-remainder = ["numbers", "microesnext-bytecode/number-remainder"]
nonterminal-conditionals = ["control-flow"]
nonterminal-exceptions = ["control-flow", "exceptions"]
nested-conditionals = ["nonterminal-conditionals"]
nested-loops = ["nested-conditionals"]
nested-exceptions = ["nonterminal-exceptions"]
structured-statements = ["nested-exceptions", "nested-loops"]
string-number-coercion = ["number-coercion", "strings"]
template-literals = ["strings", "string-operations"]
objects = ["atoms", "microesnext-bytecode/objects"]
object-destructuring-declarations = [
  "control-flow",
  "equality",
  "locals",
  "objects",
  "microesnext-bytecode/stack-operations",
]
object-destructuring-assignments = [
  "locals",
  "objects",
  "expression-statements",
  "property-assignment-expressions",
  "microesnext-bytecode/stack-operations",
]
parenthesized-expressions = []
property-assignment = ["locals", "objects", "microesnext-bytecode/property-assignment"]
receivers = ["function-arguments", "microesnext-bytecode/receivers"]
rest-parameters = ["arrays", "function-arguments", "microesnext-bytecode/rest-parameters"]
recursive-async-functions = [
  "async-functions",
  "environments",
  "microesnext-bytecode/recursive-async-functions",
]
recursive-functions = [
  "environments",
  "microesnext-bytecode/recursive-functions",
]
regexp-literals = ["construction", "host-bindings", "strings"]
recursive-constructors = [
  "constructors",
  "recursive-functions",
  "microesnext-bytecode/recursive-constructors",
]
source-positions = []
strings = ["microesnext-bytecode/strings"]
string-operations = ["strings", "microesnext-bytecode/string-operations"]
typeof = ["strings", "microesnext-bytecode/typeof"]
var-declarations = ["locals"]
void-expressions = ["expression-statements"]

[dependencies]
microesnext-bytecode.workspace = true
microesnext-values = { workspace = true, optional = true }

[lib]
path = "src/lib.rs"
