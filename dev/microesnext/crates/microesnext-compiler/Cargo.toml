[package]
name = "microesnext-compiler"
description = "Allocation-using compiler and bytecode tooling for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = [
  "equality",
  "logical-operations",
  "number-operations",
  "source-positions",
]
equality = ["microesnext-bytecode/equality"]
integer-operations = ["microesnext-bytecode/integer-operations"]
logical-operations = ["microesnext-bytecode/logical-operations"]
numbers = ["microesnext-bytecode/numbers"]
number-operations = [
  "integer-operations",
  "numbers",
  "microesnext-bytecode/number-operations",
]
source-positions = []

[dependencies]
microesnext-bytecode = { workspace = true, features = [
  "arrays",
  "async",
  "async-functions",
  "atoms",
  "control-flow",
  "exceptions",
  "environments",
  "functions",
  "function-arguments",
  "locals",
  "objects",
  "recursive-functions",
  "recursive-async-functions",
  "receivers",
  "strings",
] }

[lib]
path = "src/lib.rs"
