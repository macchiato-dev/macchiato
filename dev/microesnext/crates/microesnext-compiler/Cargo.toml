[package]
name = "microesnext-compiler"
description = "Allocation-using compiler and bytecode tooling for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
microesnext-bytecode = { workspace = true, features = [
  "arrays",
  "async",
  "async-functions",
  "atoms",
  "control-flow",
  "exceptions",
  "environments",
  "equality",
  "functions",
  "function-arguments",
  "integer-operations",
  "locals",
  "numbers",
  "objects",
  "recursive-functions",
  "recursive-async-functions",
  "receivers",
  "strings",
] }

[lib]
path = "src/lib.rs"
