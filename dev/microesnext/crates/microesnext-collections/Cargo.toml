[package]
name = "microesnext-collections"
description = "Optional ordered Map and Set storage for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
number-keys = ["dep:microesnext-equality", "microesnext-equality/numbers"]
string-keys = ["dep:microesnext-equality", "microesnext-equality/strings"]
weak = ["microesnext-arena/ephemerons"]

[dependencies]
microesnext-arena.workspace = true
microesnext-equality = { workspace = true, optional = true }
microesnext-types.workspace = true

[dev-dependencies]
microesnext-numbers.workspace = true
microesnext-objects.workspace = true
microesnext-strings.workspace = true

[lib]
path = "src/lib.rs"
