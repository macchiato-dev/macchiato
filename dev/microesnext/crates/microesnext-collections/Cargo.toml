[package]
name = "microesnext-collections"
description = "Optional ordered Map and Set storage for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
entry-iterators = ["iterators", "dep:microesnext-arrays"]
iterators = ["dep:microesnext-iterators"]
number-keys = [
  "dep:microesnext-semantics",
  "microesnext-semantics/equality",
  "microesnext-semantics/numbers",
]
string-keys = [
  "dep:microesnext-semantics",
  "microesnext-semantics/equality",
  "microesnext-semantics/string-values",
]
weak = ["microesnext-arena/ephemerons"]

[dependencies]
microesnext-arena.workspace = true
microesnext-arrays = { workspace = true, optional = true }
microesnext-semantics = { workspace = true, optional = true }
microesnext-iterators = { workspace = true, optional = true }
microesnext-types.workspace = true

[dev-dependencies]
microesnext-numbers.workspace = true
microesnext-objects.workspace = true
microesnext-strings.workspace = true

[lib]
path = "src/lib.rs"
