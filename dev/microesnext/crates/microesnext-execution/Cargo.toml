[package]
name = "microesnext-execution"
description = "Optional execution-state capabilities for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
async-functions = ["core", "microesnext-arena/async-functions"]
core = ["dep:microesnext-bytecode"]
exceptions = ["core"]
promises = []
promise-resolution = [
  "promises",
  "dep:microesnext-values",
  "microesnext-values/errors",
]
promise-resolvers = [
  "promise-resolution",
  "microesnext-arena/promise-resolvers",
]
recursive-async-functions = [
  "async-functions",
  "dep:microesnext-bindings",
  "microesnext-bindings/environments",
]
suspension = ["core"]

[dependencies]
microesnext-arena.workspace = true
microesnext-bytecode = { workspace = true, optional = true }
microesnext-bindings = { workspace = true, optional = true }
microesnext-types.workspace = true
microesnext-values = { workspace = true, optional = true }

[dev-dependencies]
microesnext-bytecode = { workspace = true, features = ["async", "control-flow", "locals"] }
microesnext-compiler.workspace = true
microesnext-objects.workspace = true

[lib]
path = "src/lib.rs"
