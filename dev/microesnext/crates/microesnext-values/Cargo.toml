[package]
name = "microesnext-values"
description = "Feature-gated scalar and guest value representations for MicroESNext"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
decimal-to-f64 = []
errors = ["dep:microesnext-arena", "microesnext-arena/errors"]
numbers = ["dep:microesnext-arena", "microesnext-arena/numbers"]
string-coercion = ["numbers", "decimal-to-f64"]
strings = ["dep:microesnext-arena"]
symbols = ["dep:microesnext-arena", "microesnext-arena/symbols"]

[dependencies]
microesnext-arena = { workspace = true, optional = true }
microesnext-types.workspace = true

[lib]
path = "src/lib.rs"
