name: Deploy Resources.co to Bunny

on:
  workflow_dispatch:
    inputs:
      target:
        description: Bunny deployment target
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: resources-${{ inputs.target }}
      url: ${{ vars.PUBLIC_ORIGIN }}
    concurrency:
      group: resources-bunny-${{ inputs.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.7.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - run: npm ci

      - name: Build validated site and edge bundle
        env:
          BLOG_EXAMPLES_ORIGIN: ${{ vars.BLOG_EXAMPLES_ORIGIN }}
        run: ./scripts/build-resources-bunny.sh

      - name: Upload immutable site export
        env:
          STORAGE_API_KEY: ${{ secrets.BUNNY_STORAGE_UPLOAD_KEY }}
          STORAGE_ORIGIN: ${{ vars.BUNNY_STORAGE_UPLOAD_ORIGIN }}
          STORAGE_PREFIX: ${{ vars.BUNNY_BUCKET_PREFIX }}
        run: |
          test -n "$STORAGE_API_KEY"
          test -n "$STORAGE_ORIGIN"
          test -n "$STORAGE_PREFIX"
          find dist/resources-bunny/site -type f -print0 |
            while IFS= read -r -d '' file; do
              key="${file#dist/resources-bunny/site/}"
              curl --fail --silent --show-error \
                --request PUT \
                --header "AccessKey: $STORAGE_API_KEY" \
                --upload-file "$file" \
                "${STORAGE_ORIGIN%/}/${STORAGE_PREFIX#/}/$key"
            done

      - name: Deploy standalone Edge Script
        uses: BunnyWay/actions/deploy-script@main
        with:
          script_id: ${{ secrets.BUNNY_SCRIPT_ID }}
          deploy_key: ${{ secrets.BUNNY_DEPLOY_KEY }}
          file: dist/resources-bunny/resources-bunny.js

      - name: Smoke test deployed site
        env:
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          BLOG_EXAMPLES_ORIGIN: ${{ vars.BLOG_EXAMPLES_ORIGIN }}
        run: |
          test -n "$PUBLIC_ORIGIN"
          test -n "$BLOG_EXAMPLES_ORIGIN"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 \
            --header 'Accept-Language: en' \
            "$PUBLIC_ORIGIN/" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --header 'Accept-Language: es' \
            "$PUBLIC_ORIGIN/about" >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$BLOG_EXAMPLES_ORIGIN/-/blog-examples/vtv/index.html?preset=types" >/dev/null
