<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Code editor</title>
  <style>
    html, body, #editor, .cm-editor { height: 100%; margin: 0; }
    body { overflow: hidden; background: var(--resources-editor-bg, transparent); }
    .cm-scroller { overflow: auto; }
    .cm-panels-bottom { max-width: 100%; }
    .project-editor__mount .cm-search .cm-textfield {
      box-sizing: border-box;
      width: 12em;
      max-width: calc(100% - 32px);
      padding: 3px 6px;
      border: 1px solid var(--resources-editor-border);
      border-radius: 3px;
      color: var(--resources-editor-fg);
      background: var(--resources-editor-bg);
      font: inherit;
    }
    .project-editor__mount .cm-search input[type="checkbox"] { width: auto; padding: 0; }
    .project-editor__mount .cm-search .cm-button {
      border: 1px solid var(--resources-editor-border);
      border-radius: 3px;
      color: var(--resources-editor-fg);
      background: var(--resources-editor-panel);
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body class="project-editor__mount">
  <div id="editor"></div>
  <script type="module">/* PROJECT_EDITOR_FRAME_CONTROLLER */</script>
</body>
</html>
