<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nested Server Workspace</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/xterm.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="identity"><span class="mark">M</span><strong>server workspace</strong><span class="status"><i></i> local</span></div>
      <nav class="tabs" role="tablist" aria-label="Workspace views">
        <div class="tab-cluster active">
          <button role="tab" aria-selected="true" aria-controls="content-panel" id="content-tab" data-view="content">Content</button>
          <!-- Lucide `refresh-cw`, ISC License; attribution in README.md. -->
          <button id="reload-preview" class="tab-reload" type="button" aria-label="Reload frontend preview" title="Reload frontend preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4"></path><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4"></path></svg></button>
        </div>
        <button role="tab" aria-selected="false" aria-controls="agent-panel" id="agent-tab" data-view="agent">Agent</button>
      </nav>
      <div class="top-actions"><span>development</span><button id="refresh" title="Refresh server state" aria-label="Refresh server state">↻</button></div>
    </header>
    <div class="workbench">
      <aside class="sidebar" aria-label="Chat and activity log">
        <div class="sidebar-heading"><div><span class="eyebrow">Live stream</span><h2>Activity</h2></div><span id="activity-count" class="count">0</span></div>
        <ol id="activity" class="activity" aria-live="polite"></ol>
        <form id="chat-form" class="composer">
          <div class="composer-toolbar"><label for="chat-input">Instruct Pi</label><button>Send</button></div>
          <textarea id="chat-input" rows="5" maxlength="4000" placeholder="Describe what you want changed…"></textarea>
        </form>
        <button id="sidebar-resizer" class="sidebar-resizer" type="button" aria-label="Resize activity sidebar" title="Drag to resize activity sidebar"></button>
      </aside>
      <main class="viewport">
        <section id="content-panel" class="panel content-panel" role="tabpanel" aria-labelledby="content-tab">
          <iframe id="app-preview" title="Frontend application preview" src="/agent-app/index.html"></iframe>
        </section>
        <section id="agent-panel" class="panel agent-panel" role="tabpanel" aria-labelledby="agent-tab" hidden>
          <header><div><span class="eyebrow">Pi coding agent</span><h1>Frontend collaborator</h1></div><span id="agent-state" class="agent-state">Checking sign-in…</span></header>
          <div class="agent-transcript">
            <ol id="agent-activity" class="agent-activity" aria-live="polite"></ol>
            <button id="agent-jump-latest" class="agent-jump-latest" type="button" hidden>↓ <span>Jump to latest</span></button>
          </div>
          <form id="agent-chat-form" class="agent-composer">
            <div class="agent-composer-toolbar"><label for="agent-chat-input">Instruct Pi</label><div><span>Mirrored with Activity</span><button>Send</button></div></div>
            <textarea id="agent-chat-input" rows="7" maxlength="4000" placeholder="Describe what you want changed in the frontend app…"></textarea>
          </form>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="/client.js"></script>
</body>
</html>
