  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d34d723c-6e13-4cd9-9d3f-db712e398ae3\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e19ae3dd-9e25-4e5e-9369-6b426e97b13f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"0394bb61-1bcb-47af-9ea0-3b1ca3916ce7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --radius: 18px;\n    --gap: 20px;\n  }\n\n  /* ============ DARK (default) — electric blue gradient ============ */\n  html[data-theme=\"dark\"] {\n    --bg:\n      radial-gradient(82vw 60vw at 90% -7vw, #6a5bff 0%, rgba(106,91,255,0) 56%),\n      radial-gradient(74vw 56vw at -6% 58vw, rgba(40,80,255,0.5) 0%, rgba(40,80,255,0) 62%),\n      linear-gradient(152deg, #1a1aa2 0%, #2626d8 52%, #16168e 100%);\n\n    --card: rgba(9,15,42,0.52);\n    --card-border: rgba(255,255,255,0.12);\n    --shadow: 0 14px 44px rgba(2,6,28,0.34);\n\n    --text: #eef2ff;\n    --muted: #aeb9e8;\n    --accent: #30D5C8;\n\n    --hover: rgba(255,255,255,0.07);\n    --pop-bg: rgba(12,18,48,0.94);\n    --active-bg: #2f5bff;\n    --active-fg: #ffffff;\n\n    --track: rgba(255,255,255,0.10);\n    --track-border: rgba(255,255,255,0.16);\n    --ghost: rgba(255,255,255,0.55);\n    --thumb: #f3f6ff;\n    --thumb-ic: #0e1b46;\n  }\n\n  /* ============ LIGHT ============ */\n  html[data-theme=\"light\"] {\n    --bg:\n      radial-gradient(78vw 56vw at 88% -8vw, #cdd9ff 0%, rgba(205,217,255,0) 56%),\n      linear-gradient(155deg, #eef1ff 0%, #dae2ff 100%);\n\n    --card: rgba(255,255,255,0.66);\n    --card-border: rgba(20,40,130,0.10);\n    --shadow: 0 14px 44px rgba(30,50,140,0.12);\n\n    --text: #0c1330;\n    --muted: #5a679f;\n    --accent: #1233f0;\n\n    --hover: rgba(18,38,150,0.06);\n    --pop-bg: rgba(255,255,255,0.97);\n    --active-bg: #1233f0;\n    --active-fg: #ffffff;\n\n    --track: rgba(18,38,150,0.08);\n    --track-border: rgba(18,38,150,0.14);\n    --ghost: rgba(18,38,150,0.45);\n    --thumb: #1233f0;\n    --thumb-ic: #ffffff;\n  }\n\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html { height: 100%; }\n\n  body {\n    font-family: \"Space Grotesk\", system-ui, sans-serif;\n    color: var(--text);\n    background: var(--bg);\n    background-attachment: fixed;\n    min-height: 100%;\n    padding: clamp(20px, 3vw, 40px);\n    display: flex;\n    flex-direction: column;\n  }\n\n  /* ============ card ============ */\n  .box {\n    background: var(--card);\n    border: 1px solid var(--card-border);\n    border-radius: var(--radius);\n    box-shadow: var(--shadow);\n    -webkit-backdrop-filter: blur(18px) saturate(135%);\n    backdrop-filter: blur(18px) saturate(135%);\n  }\n\n  /* ============ layout ============ */\n  .layout {\n    flex: 1;\n    display: grid;\n    grid-template-columns: 1fr;\n    gap: var(--gap);\n    align-items: start;\n    /* main row absorbs slack so the footer sits at the bottom when content is\n       short; when content is tall the 1fr row just grows and the footer trails\n       after it as before. */\n    grid-template-rows: auto 1fr auto;\n    grid-template-areas:\n      \"brand   userbar\"\n      \"main    main\"\n      \"footer  footer\";\n    max-width: 1380px;\n    width: 100%;\n    margin: 0 auto;\n  }\n  /* signed out: bring back the right sidebar */\n  body[data-auth=\"out\"] .layout {\n    grid-template-columns: 1fr clamp(270px, 25vw, 320px);\n    grid-template-areas:\n      \"brand   userbar\"\n      \"main    nav\"\n      \"footer  footer\";\n  }\n  body:not([data-auth=\"out\"]) .nav { display: none; }\n\n  /* ---- brand + header path ---- */\n  .brand {\n    grid-area: brand;\n    justify-self: start;\n    padding: 14px 22px;\n    display: flex;\n    align-items: center;\n    min-width: 0;\n    min-height: 64px;\n  }\n  .brand__path {\n    display: flex;\n    align-items: center;\n    flex-wrap: wrap;\n    gap: 2px;\n    min-width: 0;\n  }\n  .brand__home {\n    appearance: none;\n    background: none;\n    border: none;\n    cursor: pointer;\n    font: inherit;\n    padding: 5px 8px;\n    border-radius: 9px;\n    font-size: clamp(22px, 2.6vw, 30px);\n    font-weight: 600;\n    letter-spacing: -0.02em;\n    line-height: 1.05;\n    color: var(--text);\n    transition: background .15s ease;\n  }\n  .brand__home:hover { background: var(--hover); }\n  .brand__home .dot { color: var(--accent); }\n  .brand__sep {\n    color: var(--muted);\n    opacity: 0.45;\n    font-size: clamp(18px, 2.1vw, 25px);\n    font-weight: 300;\n    user-select: none;\n    line-height: 1;\n    padding: 0 1px;\n  }\n  .brand__seg {\n    appearance: none;\n    background: none;\n    border: none;\n    cursor: pointer;\n    font: inherit;\n    padding: 5px 9px;\n    border-radius: 9px;\n    font-size: clamp(17px, 2vw, 23px);\n    font-weight: 500;\n    letter-spacing: -0.01em;\n    line-height: 1.1;\n    color: var(--muted);\n    transition: background .15s ease, color .15s ease;\n    white-space: nowrap;\n  }\n  .brand__seg:hover { background: var(--hover); color: var(--text); }\n  .brand__seg--current {\n    color: var(--text);\n    font-weight: 600;\n    cursor: default;\n  }\n  .brand__seg--current:hover { background: none; }\n  /* On a sub-page the wordmark is hidden and the path stands alone (GitHub-style),\n     sized like the old breadcrumb. */\n  .brand__path--solo .brand__seg { font-size: 15.5px; font-weight: 500; padding: 5px 9px; }\n  .brand__path--solo .brand__seg--current { font-weight: 600; }\n  .brand__path--solo .brand__sep { font-size: 16px; }\n\n  /* ---- userbar (top-right account cluster) ---- */\n  .userbar {\n    grid-area: userbar;\n    justify-self: end;\n    position: relative;\n    z-index: 40;\n    padding: 9px 11px;\n    display: flex;\n    align-items: center;\n    gap: 5px;\n  }\n  .ub-divider { width: 1px; height: 26px; background: var(--card-border); margin: 0 4px; flex: 0 0 auto; }\n  .ub-pop { position: relative; display: flex; }\n  .ub-icon {\n    appearance: none;\n    width: 40px; height: 40px;\n    border-radius: 11px;\n    border: 1px solid transparent;\n    background: transparent;\n    color: var(--text);\n    cursor: pointer;\n    display: grid;\n    place-items: center;\n    position: relative;\n    transition: background .15s ease;\n  }\n  .ub-icon:hover { background: var(--hover); }\n  .ub-icon svg { width: 19px; height: 19px; }\n  .ub-dot {\n    position: absolute;\n    top: 8px; right: 9px;\n    width: 9px; height: 9px;\n    border-radius: 50%;\n    background: var(--accent);\n    border: 2px solid var(--card);\n  }\n  .ub-acct {\n    appearance: none;\n    display: flex;\n    align-items: center;\n    gap: 4px;\n    padding: 4px 7px 4px 4px;\n    border-radius: 999px;\n    border: 1px solid transparent;\n    background: transparent;\n    cursor: pointer;\n    transition: background .15s ease;\n  }\n  .ub-acct:hover { background: var(--hover); }\n  .ub-avatar {\n    width: 34px; height: 34px;\n    border-radius: 50%;\n    background: linear-gradient(135deg, #2f5bff 0%, #6a5bff 100%);\n    color: #fff;\n    font-weight: 700;\n    font-size: 12.5px;\n    letter-spacing: 0.02em;\n    display: grid;\n    place-items: center;\n    flex: 0 0 auto;\n  }\n  .ub-caret { width: 14px; height: 14px; color: var(--muted); }\n\n  /* popover / dropdown menus */\n  .popover {\n    position: absolute;\n    top: calc(100% + 12px);\n    right: 0;\n    min-width: 244px;\n    background: var(--pop-bg);\n    border: 1px solid var(--card-border);\n    border-radius: 15px;\n    box-shadow: var(--shadow);\n    -webkit-backdrop-filter: blur(20px) saturate(140%);\n    backdrop-filter: blur(20px) saturate(140%);\n    padding: 7px;\n    opacity: 0;\n    transform: translateY(-6px) scale(0.98);\n    transform-origin: top right;\n    pointer-events: none;\n    transition: opacity .16s ease, transform .16s ease;\n    z-index: 100;\n  }\n  .popover.open { opacity: 1; transform: none; pointer-events: auto; }\n  .menu__acct { display: flex; align-items: center; gap: 12px; padding: 9px 11px 11px; }\n  .menu__acct .ub-avatar { width: 40px; height: 40px; font-size: 14px; }\n  .menu__acct-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }\n  .menu__acct-meta b { font-size: 14.5px; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }\n  .menu__acct-meta span { font-size: 12px; color: var(--muted); }\n  .menu__head { padding: 9px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }\n  .menu__sep { height: 1px; background: var(--card-border); margin: 6px 5px; }\n  .menu__empty { padding: 6px 12px 12px; font-size: 13.5px; color: var(--muted); }\n  .menu .item {\n    appearance: none;\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    width: 100%;\n    text-align: left;\n    padding: 9px 12px;\n    border: none;\n    border-radius: 10px;\n    background: none;\n    font: inherit;\n    font-size: 14.5px;\n    font-weight: 500;\n    letter-spacing: -0.01em;\n    color: var(--text);\n    cursor: pointer;\n    transition: background .12s ease;\n  }\n  .menu .item:hover { background: var(--hover); }\n  .menu .item svg { width: 17px; height: 17px; color: var(--muted); flex: 0 0 auto; }\ ved.<\u002Fdiv>\n        <div class=\"foot-links\">\n          <button data-foot=\"terms\">Terms of Use<\u002Fbutton>\n          <button data-foot=\"privacy\">Privacy Policy<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <!-- expanded footer: Home only -->\n      <div class=\"footer-app\">\n        <div class=\"fa-top\">\n          <div class=\"fa-brand\">\n            <span class=\"fa-word\">Resources<span class=\"dot\">.co<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"fa-cols\">\n            <div class=\"fa-col\">\n              <div class=\"fa-h\">Navigate<\u002Fdiv>\n              <button data-foot=\"explore\">Explore<\u002Fbutton>\n              <button data-foot=\"blog\">Blog<\u002Fbutton>\n              <button data-foot=\"about\">About<\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"fa-col\">\n              <div class=\"fa-h\">Legal<\u002Fdiv>\n              <button data-foot=\"terms\">Terms of Use<\u002Fbutton>\n              <button data-foot=\"privacy\">Privacy Policy<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"fa-bottom\">\n          <span class=\"copy\">© 2026 Resources<span class=\"dot\">.co<\u002Fspan>. All rights reserved.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fmain>\n\n\n    <script>\n    /* ============ theme (Dark / Light / System) ============ */\n    (function () {\n      var root = document.documentElement;\n      var KEY = \"resources-appearance\";           // 'dark' | 'light' | 'system'\n      var mql = window.matchMedia(\"(prefers-color-scheme: dark)\");\n      var btns = Array.prototype.slice.call(document.querySelectorAll(\"[data-theme-choice]\"));\n\n      function getChoice() {\n        var c;\n        try { c = localStorage.getItem(KEY); } catch (e) {}\n        // Default to dark — this site invests more in its dark theme, so it's the\n        // preferred default rather than following the OS setting.\n        return (c === \"dark\" || c === \"light\" || c === \"system\") ? c : \"dark\";\n      }\n      function effective(choice) {\n        return choice === \"system\" ? (mql.matches ? \"dark\" : \"light\") : choice;\n      }\n      function paint() {\n        var choice = getChoice();\n        root.setAttribute(\"data-theme\", effective(choice));\n        btns.forEach(function (b) {\n          b.setAttribute(\"aria-pressed\", b.getAttribute(\"data-theme-choice\") === choice ? \"true\" : \"false\");\n        });\n      }\n      function setChoice(c) {\n        try { localStorage.setItem(KEY, c); } catch (e) {}\n        paint();\n      }\n\n      btns.forEach(function (b) {\n        b.addEventListener(\"click\", function (e) {\n          e.stopPropagation();\n          setChoice(b.getAttribute(\"data-theme-choice\"));\n        });\n      });\n\n      // Keep \"System\" live if the OS theme flips while selected.\n      function onSysChange() { if (getChoice() === \"system\") paint(); }\n      if (mql.addEventListener) mql.addEventListener(\"change\", onSysChange);\n      else if (mql.addListener) mql.addListener(onSysChange);\n\n      paint();\n    })();\n\n    /* ============ userbar popovers (notifications / create / account) ============ */\n    (function () {\n      var pops = Array.prototype.slice.call(document.querySelectorAll(\".ub-pop\"));\n\n      function closeAll(except) {\n        pops.forEach(function (p) {\n          if (p === except) return;\n          p.querySelector(\".popover\").classList.remove(\"open\");\n          p.querySelector(\"[data-pop]\").setAttribute(\"aria-expanded\", \"false\");\n        });\n      }\n\n      pops.forEach(function (p) {\n        var trigger = p.querySelector(\"[data-pop]\");\n        var menu = p.querySelector(\".popover\");\n        trigger.addEventListener(\"click\", function (e) {\n          e.stopPropagation();\n          var willOpen = !menu.classList.contains(\"open\");\n          closeAll(p);\n          menu.classList.toggle(\"open\", willOpen);\n          trigger.setAttribute(\"aria-expanded\", willOpen ? \"true\" : \"false\");\n        });\n        menu.addEventListener(\"click\", function (e) { e.stopPropagation(); });\n      });\n\n      document.addEventListener(\"click\", function () { closeAll(null); });\n      document.addEventListener(\"keydown\", function (e) { if (e.key === \"Escape\") closeAll(null); });\n    })();\n\n    /* ============ content ============ */\n    (function () {\n      var HOME_ICON =\n        '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' +\n        '<path d=\"M3 10.6 12 3l9 7.6\"><\u002Fpath>' +\n        '<path d=\"M5.5 9.5V20a1 1 0 0 0 1 1H10v-5.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V21h3.5a1 1 0 0 0 1-1V9.5\"><\u002Fpath>' +\n        '<\u002Fsvg>';\n\n      // ============================================================\n      //  DEV SWITCH — flip to load the page signed out vs signed in.\n      //  (In-session Log in / Sign out still work and override this.)\n      var START_SIGNED_IN = true;\n      // ============================================================\n      if (!START_SIGNED_IN) document.body.setAttribute(\"data-auth\", \"out\");\n      function isSignedIn() { return document.body.getAttribute(\"data-auth\") !== \"out\"; }\n\n      // The signed-in identity and the data we show them.\n      var USER = {\n        handle: \"macchiato-dev\",\n        namespace: \"macchiato\",\n        projects: [\n          { name: \"macchiato/components\", desc: \"Composable UI building blocks · v1.4.0\", to: \"macchiato/components\" }\n        ],\n        recent: { label: \"hello-html\", path: \"Updated 3 hours ago\", to: \"container/a1b2c3d4e5f6\" }\n      };\n\n      // The signed-in workspace is a set of running container instances\n      // (Docker/Podman terminology: image, status, ports, uptime, command).\n      // Simple, self-contained sandbox examples — one small demo per kind\n      // (HTML, JavaScript, Canvas). Each runs live in an isolated iframe.\n      // The system packages (containers / components / providers) come later.\n      var CONTAINERS = [\n        { id: \"a1b2c3d4e5f6\", name: \"hello-html\",    project: \"macchiato/hello-html\",    kind: \"html\",   ex: \"hello\", desc: \"A minimal HTML page \\u2014 markup and styles.\",   entry: \"index.html\", size: \"1 KB\", created: \"3 hours ago\" },\n        { id: \"b7f3a9c1d2e0\", name: \"digital-clock\",  project: \"macchiato/digital-clock\",  kind: \"html\",   ex: \"clock\", desc: \"HTML with a little JavaScript \\u2014 a live clock.\", entry: \"index.html\", size: \"1 KB\", created: \"2 days ago\" },\n        { id: \"c1d2e3f4a5b6\", name: \"logo-mark\",     project: \"macchiato/logo-mark\",     kind: \"svg\",    ex: \"mark\",  desc: \"A logo mark drawn in SVG.\",                 entry: \"index.html\", size: \"1 KB\", created: \"yesterday\" },\n        { id: \"99aa88bb77cc\", name: \"bar-chart\",     project: \"macchiato/bar-chart\",     kind: \"svg\",    ex: \"chart\", desc: \"A tiny bar chart in SVG.\",                  entry: \"index.html\", size: \"1 KB\", created: \"4 days ago\" },\n        { id: \"1122334455dd\", name: \"bouncing-ball\",  project: \"macchiato/bouncing-ball\",  kind: \"canvas\", ex: \"ball\",  desc: \"A ball bouncing on a 2D canvas.\",          entry: \"index.html\", size: \"2 KB\", created: \"5 days ago\" },\n        { id: \"aabbccddee01\", name: \"starfield\",     project: \"macchiato/starfield\",     kind: \"canvas\", ex: \"stars\", desc: \"An animated starfield on canvas.\",         entry: \"index.html\", size: \"2 KB\", created: \"6 days ago\" }\n      ];\n      var KIND_LABEL = { html: \"HTML\", svg: \"SVG\", canvas: \"Canvas\" };\n      // colour the primary-use pill by provider family\n      var USE_COLOR = { \"dom-use\": \"k-dom\", \"style-use\": \"k-style\", \"navigator-use\": \"k-nav\", \"canvas-use\": \"k-canvas\" };\n      function containerById(id) {\n        for (var i = 0; i < CONTAINERS.length; i++) if (CONTAINERS[i].id === id) return CONTAINERS[i];\n        return null;\n      }\n\n      // Featured collections — each lives at <namespace>/<name> and gets its own page.\n      // Keyed by full path so the namespace is open: anyone can publish under their own org.\n      var COLLECTIONS = {\n        \"resources/containers\": {\n          name: \"Containers\",\n          tagline: \"Self-hostable runtimes for everything you ship.\",\n          intro: \"Lightweight, self-hosted runtimes that boot fast and stay out of your way. Run them on the infrastructure you already have.\",\n          items: [\n            { name: \"Edge runtime\", desc: \"A minimal container that boots in milliseconds.\" },\n            { name: \"Job container\", desc: \"Run background work without standing infrastructure.\" },\n            { name: \"Static host\", desc: \"Serve assets from your own edge in one command.\" }\n          ]\n        },\n        \"macchiato/components\": {\n          name: \"Components\",\n          tagline: \"Composable UI and service building blocks.\",\n          intro: \"Drop-in building blocks for the surface of your app — each one self-contained, themeable, and ready to compose.\",\n          items: [\n            { name: \"Data table\", desc: \"Sorting, paging, and selection out of the box.\" },\n            { name: \"Command menu\", desc: \"A keyboard-first launcher you can drop in.\" },\n            { name: \"Form kit\", desc: \"Validation and state handled for you.\" }\n          ]\n        },\n        \"resources/usage-providers\": {\n          name: \"Usage providers\",\n          tagline: \"DOM, Style, and Navigator state — shared cleanly.\",\n          intro: \"Providers that expose live browser state to the rest of your app without prop-drilling or duplicated listeners.\",\n          items: [\n            { name: \"DOM use\", desc: \"Subscribe to layout, focus, and visibility state.\" },\n            { name: \"Style use\", desc: \"Read and react to computed style and theme.\" },\n            { name: \"Navigator use\", desc: \"Connection, locale, and device capabilities.\" }\n          ]\n        },\n        \"halcyon/design-tokens\": {\n          name: \"Design tokens\",\n          tagline: \"A living spec for color, type, and spacing.\",\n          intro: \"One source of truth for your visual language, versioned alongside your code and exported to wherever it needs to go.\",\n          items: [\n            { name: \"Token spec\", desc: \"Color, type, and spacing as a single source of truth.\" },\n            { name: \"Theme builder\", desc: \"Compose and preview token sets in the browser.\" },\n            { name: \"Export targets\", desc: \"Ship tokens to CSS, JSON, and native.\" }\n          ]\n        },\n        \"northwind/adapters\": {\n          name: \"Adapters\",\n          tagline: \"Uniform interfaces to external services and data.\",\n          intro: \"Thin, swappable interfaces that let you change providers without rewriting the code that depends on them.\",\n          items: [\n            { name: \"Storage adapter\", desc: \"One API across S3, GCS, and local disk.\" },\n            { name: \"Queue adapter\", desc: \"Swap brokers without touching your code.\" },\n            { name: \"Auth adapter\", desc: \"Plug in any identity provider.\" }\n          ]\n        }\n      };\n      // Split into individual PROJECTS (repo-like) and curated COLLECTIONS (sets).\n      var PROJECT_ORDER = [\"macchiato/components\", \"resources/containers\", \"halcyon/design-tokens\"];\n      var COLLECTION_ORDER = [\"resources/usage-providers\", \"northwind/adapters\"];\n\n      // Organization profiles — reachable via the namespace segment of a breadcrumb.\n      var ORGS = {\n        resources: { name: \"resources\", blurb: \"The team behind Resources.co — self-hostable primitives for the web.\" },\n        macchiato: { name: \"macchiato\", blurb: \"A small studio publishing composable UI building blocks.\" },\n        halcyon: { name: \"halcyon\", blurb: \"Design-systems tooling, versioned alongside your code.\" },\n        northwind: { name: \"northwind\", blurb: \"Infrastructure adapters that keep your code provider-agnostic.\" }\n      };\n\n      // All projects + collections owned by a namespace.\n      function childrenOf(ns) {\n        return PROJECT_ORDER.concat(COLLECTION_ORDER).filter(function (path) { return path.split(\"/\")[0] === ns; })\n          .map(function (path) {\n            return { name: path, desc: COLLECTIONS[path].tagline, to: path };\n          });\n      }\n\n      // ---- Repositories ----\n      // One collection (macchiato/components) behaves like a GitHub-style repo:\n      // a navigable file tree, with a secondary in-content breadcrumb for the path\n      // *inside* the repo (the header keeps showing just owner / repo).\n      var FOLDER_ICON = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z\"><\u002Fpath><\u002Fsvg>';\n      var FILE_ICON = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><polyline points=\"14 2 14 8 20 8\"><\u002Fpolyline><\u002Fsvg>';\n\n      var REPOS = {\n        \"macchiato/components\": {\n          owner: \"macchiato\",\n          repo: \"components\",\n          desc: \"Composable UI building blocks — self-contained, themeable, and ready to drop in.\",\n          tree: {\n            \"src\": { __dir: true, children: {\n              \"inputs\": { __dir: true, children: {\n                \"Button.tsx\": { content: \"import { forwardRef } from \\\"react\\\";\\n\\nexport const Button = forwardRef(function Button(props, ref) {\\n  const { variant = \\\"solid\\\", ...rest } = props;\\n  return <button ref={ref} data-variant={variant} {...rest} />;\\n});\\n\" },\n                \"TextField.tsx\": { content: \"export function TextField({ label, ...props }) {\\n  return (\\n    <label className=\\\"field\\\">\\n      <span>{label}<\u002Fspan>\\n      <input {...props} />\\n    <\u002Flabel>\\n  );\\n}\\n\" }\n              }},\n              \"DataTable.tsx\": { content: \"export function DataTable({ columns, rows }) {\\n  // sorting, paging and selection, handled for you\\n  return <table>{/* ... */}<\u002Ftable>;\\n}\\n\" },\n              \"CommandMenu.tsx\": { content: \"export function CommandMenu({ actions }) {\\n  // a keyboard-first launcher you can drop in\\n  return <dialog>{/* ... */}<\u002Fdialog>;\\n}\\n\" }\n            }},\n            \"README.md\": { content: \"# components\\n\\nComposable UI building blocks — self-contained, themeable,\\nand ready to drop in.\\n\\n## Install\\n\\n    npm i @macchiato/components\\n\" },\n            \"package.json\": { content: \"{\\n  \\\"name\\\": \\\"@macchiato/components\\\",\\n  \\\"version\\\": \\\"1.4.0\\\",\\n  \\\"type\\\": \\\"module\\\"\\n}\\n\" }\n          }\n        }\n      };\n\n      function repoRootFor(route) {\n        for (var rp in REPOS) { if (route === rp || route.indexOf(rp + \"/\") === 0) return rp; }\n        return null;\n      }\n      function walkRepo(repo, parts) {\n        var node = { __dir: true, children: repo.tree };\n        for (var i = 0; i < parts.length; i++) {\n          if (!node || !node.__dir) return null;\n          node = node.children[parts[i]];\n          if (!node) return null;\n        }\n        return node;\n      }\n      function dirListing(repoRoot, relParts, node) {\n        return Object.keys(node.children).map(function (name) {\n          var isDir = !!node.children[name].__dir;\n          return { name: name, kind: isDir ? \"dir\" : \"file\", to: repoRoot + \"/\" + relParts.concat(name).join(\"/\") };\n        }).sort(function (a, b) {\n          if (a.kind !== b.kind) return a.kind === \"dir\" ? -1 : 1;\n          return a.name.localeCompare(b.name);\n        });\n      }\n      function repoSubcrumb(repoRoot, repo, relParts) {\n        var segs = [{ label: repo.repo, to: relParts.length ? repoRoot : null }];\n        var acc = repoRoot;\n        relParts.forEach(function (p, i) {\n          acc += \"/\" + p;\n          segs.push({ label: p, to: i === relParts.length - 1 ? null : acc });\n        });\n        return segs;\n      }\n\n      // Collections rendered as clickable links (used on Home + Explore).\n      // The bold label is literally the namespaced path.\n      function collectionLinks() {\n        return COLLECTION_ORDER.map(function (path) {\n          return { name: path, desc: COLLECTIONS[path].tagline, to: path };\n        });\n      }\n      function projectLinks() {\n        return PROJECT_ORDER.map(function (path) {\n          return { name: path, desc: COLLECTIONS[path].tagline, to: path };\n        });\n      }\n\n      // ---- Blog posts ----\n      var POSTS = {\n        \"composing-infrastructure\": {\n          title: \"Composing infrastructure from parts\",\n          cat: \"Engineering\", date: \"Jun 12, 2026\", read: \"6 min read\",\n          author: { name: \"Mara Devlin\", initials: \"MD\" },\n          tags: [\"Architecture\", \"Self-hosting\", \"Namespaces\"],\n          body: [\n            { p: \"Most infrastructure tools ask you to adopt a platform. You learn its concepts, accept its defaults, and slowly shape your system around the way it wants to work. We took the opposite bet: give people small, self-hostable parts and let them compose the platform they actually want.\" },\n            { p: \"A container, a component, a usage provider — on Resources.co these are all just projects living in one open namespace. Nothing is privileged. The thing you publish sits next to the thing we publish, addressed the same way, run the same way.\" },\n            { h2: \"One namespace, many shapes\" },\n            { p: \"Treating every artifact as a project in a flat namespace means a URL is all you need to find, run, or fork something. There's no separate registry per content type, no special-casing. A repository can be code, a token set, an adapter — whatever earns its place.\" },\n            { quote: \"Owning your stack shouldn't mean rebuilding it from scratch.\" },\n            { p: \"The payoff shows up when parts start to combine. Containers run your code, components shape the surface, providers share state across both — and because they speak the same conventions, wiring them together is the boring part, which is exactly where you want the boredom to be.\" }\n          ]\n        },\n        \"usage-providers-explained\": {\n          title: \"Usage providers, explained\",\n          cat: \"Concepts\", date: \"May 30, 2026\", read: \"5 min read\",\n          author: { name: \"Theo Park\", initials: \"TP\" },\n          tags: [\"Usage providers\", \"State\", \"DOM\"],\n          body: [\n            { p: \"A usage provider is a small piece that exposes live browser state to the rest of your app without prop-drilling or a pile of duplicated listeners. DOM use, Style use, Navigator use — each wraps one source of truth and lets anything subscribe.\" },\n            { p: \"The idea is unglamorous on purpose. Instead of every component attaching its own resize observer or media query listener, a provider owns that subscription once and hands out the current value. Fewer listeners, one place to reason about, no drift between copies.\" },\n            { h2: \"Why not just hooks?\" },\n            { p: \"Hooks are great until the same state is needed in five unrelated places. A provider hoists that concern out of the component tree so it can be read anywhere — and swapped or mocked in tests without touching the consumers.\" },\n            { code: \"const conn = use(NavigatorUse).connection;\\nif (conn.saveData) loadLowRes();\" },\n            { p: \"Same shape for DOM and Style. Subscribe, read, react. The provider handles the messy part of staying current; your code just asks what's true right now.\" }\n          ]\n        },\n        \"self-hosting-without-sprawl\": {\n          title: \"Self-hosting without the sprawl\",\n          cat: \"Operations\", date: \"May 14, 2026\", read: \"7 min read\",\n          author: { name: \"Mara Devlin\", initials: \"MD\" },\n          tags: [\"Self-hosting\", \"Ops\", \"Containers\"],\n          body: [\n            { p: \"Self-hosting has a reputation: a weekend that turns into a second job. It doesn't have to. The trick is to keep the surface small and let it grow only when something actually demands it.\" },\n            { p: \"Start with one box. Run the container, point a domain at it, and resist the urge to add orchestration you don't need yet. A single host handles far more than people expect, and the operational story stays in your head instead of in a diagram.\" },\n            { h2: \"Grow on evidence, not anxiety\" },\n            { p: \"When a part genuinely needs more, you add exactly that part — another container, a queue adapter, a read replica. Each addition is swappable, so you're never committing to a stack, only to the next concrete need.\" },\n            { p: \"Boring on purpose is the whole point. The fewer moving pieces, the more time you spend on the thing you're actually building.\" }\n          ]\n        },\n        \"containers-that-boot-fast\": {\n          title: \"Containers that boot in milliseconds\",\n          cat: \"Engineering\", date: \"Apr 28, 2026\", read: \"4 min read\",\n          author: { name: \"Lin Ortega\", initials: \"LO\" },\n          tags: [\"Containers\", \"Performance\"],\n          body: [\n            { p: \"Cold starts are where a lot of self-hosted setups quietly lose. If spinning up work takes seconds, you over-provision to hide it — and pay for idle capacity all day.\" },\n            { p: \"Our edge runtime is built to boot in milliseconds, so you can scale to zero between requests and not feel it. The container is minimal by design: no kitchen-sink base image, just what the job needs.\" },\n            { h2: \"Minimal is faster\" },\n            { p: \"Every layer you don't ship is a layer you don't pull, unpack, or scan. A small image isn't only cheaper to store — it's the reason the thing starts before the user notices.\" }\n          ]\n        },\n        \"design-tokens-single-source\": {\n          title: \"Design tokens as a single source of truth\",\n          cat: \"Design\", date: \"Apr 9, 2026\", read: \"5 min read\",\n          author: { name: \"Theo Park\", initials: \"TP\" },\n          tags: [\"Design tokens\", \"Theming\"],\n          body: [\n            { p: \"A design system drifts the moment color and spacing live in more than one place. Tokens fix that by making one definition the source everything else derives from.\" },\n            { p: \"Version them alongside your code, preview changes in the browser, and export to wherever they're needed — CSS, JSON, native. Change the token, and every surface that reads it updates together.\" },\n            { quote: \"Consistency you don't have to maintain by hand is the only kind that lasts.\" },\n            { p: \"The goal isn't a prettier spec document. It's removing the human step where consistency usually breaks.\" }\n          ]\n        }\n      };\n      var POST_ORDER = [\"composing-infrastructure\", \"usage-providers-explained\", \"self-hosting-without-sprawl\", \"containers-that-boot-fast\", \"design-tokens-single-source\"];\n\n      function blogIndexBlocks() {\n        var arr = [{ hero: true, eyebrow: \"The Resources.co blog\", h1: \"Notes from the namespace\", paras: [\"Writing on self-hosting, composability, and what we're building.\"] }];\n        POST_ORDER.forEach(function (slug) { arr.push({ postexcerpt: slug }); });\n        return arr;\n      }\n\n      // Home is the same content/discovery page for everyone; when you're signed\n      // in we prepend a personal strip (greeting + your projects) above the\n      // featured content, rather than swapping in a separate dashboard.\n      function homeBlocks() {\n        var featured = [\n          { h2: \"Featured projects\", items: projectLinks() },\n          { h2: \"Featured collections\", items: collectionLinks() }\n        ];\n        if (isSignedIn()) {\n          // Signed in: the home landing is your workspace only — featured\n          // discovery lives on Explore, not stacked below your projects.\n          return [\n            { containers: true, h2: \"Your projects\", cta: { label: \"New project\", route: \"new\" } }\n          ];\n        }\n        return [\n          { hero: true, eyebrow: \"Self-hosted building blocks\", h1: \"Infrastructure you own, composed from parts.\",\n            paras: [\n              \"Resources.co is a startup building self-hostable primitives for the web — containers, components, and usage providers you run on your own stack, wired together however you like.\",\n              \"Pick a section from the panel on the right to start, or browse the full catalogue.\"\n            ], cta: { label: \"Create your account\", route: \"signup\" } }\n        ].concat(featured);\n      }\n\n      var SECTIONS = {\n        home: {\n          label: \"Home\"\n        },\n        explore: {\n          label: \"Explore\",\n          blocks: [\n            { hero: true, h1: \"Explore Resources.co\", paras: [\"Discover projects and collections published across the open namespace — yours and everyone else's.\"] },\n            { h2: \"Featured projects\", items: projectLinks() },\n            { h2: \"Featured collections\", items: collectionLinks() }\n          ]\n        },\n        blog: {\n          la  });\n        return { el: l, sel: sel };\n      }\n      function templateChips() {\n        var c = h(\"div\", \"np-chips\"); var sel = { v: null };\n        TEMPLATES.forEach(function (t) {\n          var b = h(\"button\", \"np-chip\"); b.type = \"button\"; b.setAttribute(\"aria-pressed\", \"false\");\n          b.appendChild(tplIcon(t)); b.appendChild(h(\"span\", null, t.name));\n          b.addEventListener(\"click\", function () { sel.v = t.id; c.querySelectorAll(\".np-chip\").forEach(function (x) { x.setAttribute(\"aria-pressed\", \"false\"); }); b.setAttribute(\"aria-pressed\", \"true\"); });\n          c.appendChild(b);\n        });\n        return { el: c, sel: sel };\n      }\n\n      // ---------- overlay helpers (modal flows) ----------\n      function close() {\n        var b = root.querySelector(\".np-back\");\n        if (!b) return;\n        b.classList.remove(\"is-open\");\n        setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 240);\n        document.removeEventListener(\"keydown\", onEsc);\n      }\n      function onEsc(e) { if (e.key === \"Escape\") close(); }\n      function backdrop() {\n        var b = h(\"div\", \"np-back\");\n        b.addEventListener(\"click\", function (e) { if (e.target === b) close(); });\n        root.innerHTML = \"\"; root.appendChild(b);\n        requestAnimationFrame(function () { b.classList.add(\"is-open\"); });\n        document.addEventListener(\"keydown\", onEsc);\n        return b;\n      }\n      function iclose(card) { var x = h(\"button\", \"np-iclose\", \"\\u00d7\"); x.addEventListener(\"click\", close); card.appendChild(x); }\n      function labelEl(txt, mt) { var l = h(\"div\", \"np-label\", txt); l.style.margin = (mt || \"20px\") + \" 0 9px\"; return l; }\n\n      // ---------- Flow 1: Quick modal (close to the original) ----------\n      function openModal() {\n        var b = backdrop();\n        var card = h(\"div\", \"np-card np-modal\"); card.style.position = \"relative\";\n        card.appendChild(h(\"div\", \"np-title\", \"New project\"));\n        card.appendChild(h(\"div\", \"np-sub\", \"Name it and pick a starting point.\"));\n        iclose(card);\n        var nf = nameField();\n        card.appendChild(labelEl(\"Project name\")); card.appendChild(nf.field);\n        var vr = h(\"div\"); vr.style.cssText = \"display:flex;align-items:center;justify-content:space-between;margin-top:16px;\";\n        vr.appendChild(h(\"div\", \"np-label\", \"Visibility\")); vr.appendChild(visibility()); card.appendChild(vr);\n        card.appendChild(labelEl(\"Template\")); card.appendChild(templateGrid().el);\n        var foot = h(\"div\"); foot.style.cssText = \"display:flex;justify-content:flex-end;gap:10px;margin-top:24px;\";\n        var cancel = h(\"button\", \"np-btn\", \"Cancel\"); cancel.addEventListener(\"click\", close);\n        var create = h(\"button\", \"np-btn np-btn--primary\", \"Create project\"); create.addEventListener(\"click\", function () { close(); toast(\"Project created\"); });\n        foot.appendChild(cancel); foot.appendChild(create); card.appendChild(foot);\n        b.appendChild(card);\n        setTimeout(function () { nf.input.focus(); }, 60);\n      }\n\n      // ---------- Flow 2: Name & details modal (identity-first, condensed template) ----------\n      function openDetails() {\n        var b = backdrop();\n        var card = h(\"div\", \"np-card np-modal\"); card.style.position = \"relative\";\n        card.appendChild(h(\"div\", \"np-title\", \"Create a project\"));\n        card.appendChild(h(\"div\", \"np-sub\", \"Start with what it's called \\u2014 the rest is optional.\"));\n        iclose(card);\n        var nf = nameField(); nf.field.style.marginTop = \"20px\"; card.appendChild(nf.field);\n        var df = textField(\"Description (optional)\"); df.field.style.marginTop = \"10px\"; card.appendChild(df.field);\n        var vr = h(\"div\"); vr.style.cssText = \"display:flex;align-items:center;justify-content:space-between;margin-top:18px;\";\n        vr.appendChild(h(\"div\", \"np-label\", \"Visibility\")); vr.appendChild(visibility()); card.appendChild(vr);\n        card.appendChild(labelEl(\"Template\")); card.appendChild(templateChips().el);\n        var foot = h(\"div\"); foot.style.cssText = \"display:flex;justify-content:flex-end;gap:10px;margin-top:24px;\";\n        var cancel = h(\"button\", \"np-btn\", \"Cancel\"); cancel.addEventListener(\"click\", close);\n        var create = h(\"button\", \"np-btn np-btn--primary\", \"Create project\"); create.addEventListener(\"click\", function () { close(); toast(\"Project created\"); });\n        foot.appendChild(cancel); foot.appendChild(create); card.appendChild(foot);\n        b.appendChild(card);\n        setTimeout(function () { nf.input.focus(); }, 60);\n      }\n\n      // ---------- The chosen flow: template-led real page (navigate, no lightbox) ----------\n      // Layout is fixed (gallery + sticky bottom bar). The four options iterate ONLY on the\n      // name-field surface — all dark and theme-consistent (not the popup fill, not white).\n      function pageShell(title, sub) {\n        var wrap = h(\"section\", \"box block np-formpage\");\n        wrap.appendChild(h(\"div\", \"np-label\", \"Create a project\"));\n        wrap.appendChild(h(\"div\", \"np-title\", title));\n        wrap.appendChild(h(\"div\", \"np-sub\", sub));\n        return wrap;\n      }\n      function createBtn(label) {\n        var b = h(\"button\", \"np-btn np-btn--primary\", label || \"Create project\");\n        b.addEventListener(\"click\", function () { window.RC.go(\"home\"); toast(\"Project created\"); });\n        return b;\n      }\n\n      function buildTemplatePage() {\n        var wrap = pageShell(\"Create a project\", \"Pick a template, give it a name, then create.\");\n\n        function refresh() { create.disabled = !(tg.sel.v && nf.input.value.trim()); }\n\n        var tg = templateGrid(function () { refresh(); });\n        tg.el.style.marginTop = \"22px\"; wrap.appendChild(tg.el);\n\n        var df = textField(\"Description (optional)\"); df.field.style.marginTop = \"14px\"; wrap.appendChild(df.field);\n\n        var vr = h(\"div\", \"np-visrow\");\n        vr.appendChild(h(\"div\", \"np-label\", \"Visibility\"));\n        var vis = visibility(); vr.appendChild(vis); wrap.appendChild(vr);\n\n        var bar = h(\"div\", \"np-stickybar\");\n        var nf = nameField(\"np-field--final\");\n        var create = h(\"button\", \"np-btn np-btn--primary\", \"Create project\"); create.disabled = true;\n        bar.appendChild(nf.field); bar.appendChild(create);\n        wrap.appendChild(bar);\n\n        nf.input.addEventListener(\"input\", refresh);\n        nf.input.addEventListener(\"keydown\", function (e) { if (e.key === \"Enter\" && !create.disabled) create.click(); });\n        function selectedVisibility() { var on = vis.querySelector(\".np-seg2btn.is-on\"); return on ? on.textContent.trim() : \"Public\"; }\n\n        create.addEventListener(\"click\", function () {\n          var name = nf.input.value.trim().toLowerCase().replace(/\\s+/g, \"-\");\n          if (!name || !tg.sel.v) return;\n          var id = window.RC.createProject({\n            name: name, kind: tg.sel.t.kind, org: nf.org.value,\n            desc: df.input.value, visibility: selectedVisibility()\n          });\n          toast(\"Created \" + name);\n          window.RC.go(\"container/\" + id);\n        });\n        return [wrap];\n      }\n      function openPage() { if (window.RC) window.RC.go(\"new\"); }\n\n      // Register the real \"new\" route once; build() re-reads the active surface.\n      if (window.RC && window.RC.registerRoute) {\n        window.RC.registerRoute(\"new\", {\n          navKey: null,\n          path: [{ label: \"New project\" }],\n          build: function () { return buildTemplatePage(); }\n        });\n      }\n\n      function openNewProject() { openPage(); }\n\n      // ---------- wire the + \\u2192 New project button ----------\n      var npBtn = document.getElementById(\"new-project-btn\");\n      if (npBtn) {\n        npBtn.addEventListener(\"click\", function (e) {\n          e.preventDefault(); e.stopPropagation();\n          document.querySelectorAll(\".popover.open\").forEach(function (p) {\n            p.classList.remove(\"open\");\n            var par = p.parentNode && p.parentNode.querySelector(\"[data-pop]\");\n            if (par) par.setAttribute(\"aria-expanded\", \"false\");\n          });\n          openNewProject();\n        });\n      }\n\n      // ---------- (flow picker removed — design is baked in) ----------\n    })();\n\n    /* ============ auth: sign in / sign up (simulated OAuth) ============ */\n    (function () {\n      var GH_ICON = '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"><path d=\"M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12\"><\u002Fpath><\u002Fsvg>';\n      var GL_ICON = '<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path fill=\"#E24329\" d=\"M12 21.42 15.31 11.2H8.69L12 21.42z\"><\u002Fpath><path fill=\"#FC6D26\" d=\"M12 21.42 8.69 11.2H4.05L12 21.42z\"><\u002Fpath><path fill=\"#FCA326\" d=\"M4.05 11.2 3.04 14.3a.69.69 0 0 0 .25.77L12 21.42 4.05 11.2z\"><\u002Fpath><path fill=\"#E24329\" d=\"M4.05 11.2h4.64L6.69 5.06a.      function authToast(msg) {\n        var t = document.createElement(\"div\"); t.className = \"np-toast\"; t.textContent = msg;\n        document.body.appendChild(t);\n        requestAnimationFrame(function () { t.classList.add(\"is-on\"); });\n        setTimeout(function () { t.classList.remove(\"is-on\"); setTimeout(function () { t.remove(); }, 300); }, 2200);\n      }\n      function setAuth(state) {\n        if (state === \"in\") document.body.removeAttribute(\"data-auth\");\n        else document.body.setAttribute(\"data-auth\", \"out\");\n      }\n\n      function providerBtn(kind, label, icon, onPick) {\n        var b = window.RC.el(\"button\", \"auth-prov\");\n        b.innerHTML = icon + \"<span>\" + label + \"<\u002Fspan>\";\n        b.addEventListener(\"click\", function () { onPick(b); });\n        return b;\n      }\n\n      function buildAuth(mode) {\n        var isSignup = mode === \"signup\";\n        var wrap = window.RC.el(\"div\", \"auth-wrap\");\n        var card = window.RC.el(\"section\", \"box auth-card\");\n        card.appendChild(window.RC.el(\"div\", \"auth-eyebrow\", isSignup ? \"Join Resources.co\" : \"Welcome back\"));\n        card.appendChild(window.RC.el(\"h1\", \"auth-h1\", isSignup ? \"Create your account\" : \"Log in to Resources.co\"));\n        card.appendChild(window.RC.el(\"p\", \"auth-sub\", isSignup\n          ? \"Use a provider you already have. We'll set up your namespace on first sign-in.\"\n          : \"Continue with the provider you used to sign up.\"));\n\n        var provs = window.RC.el(\"div\", \"auth-providers\");\n        function pick(name) {\n          return function (clicked) {\n            var all = provs.querySelectorAll(\".auth-prov\");\n            Array.prototype.forEach.call(all, function (x) { x.setAttribute(\"disabled\", \"true\"); });\n            clicked.innerHTML = '<span class=\"spin\"><\u002Fspan><span>Redirecting to ' + name + '\\u2026<\u002Fspan>';\n            setTimeout(function () {\n              clicked.innerHTML = '<span class=\"spin\"><\u002Fspan><span>Authorizing\\u2026<\u002Fspan>';\n            }, 850);\n            setTimeout(function () {\n              setAuth(\"in\");\n              window.RC.go(\"home\");\n              authToast((isSignup ? \"Account created \\u2014 signed in with \" : \"Signed in with \") + name);\n            }, 1750);\n          };\n        }\n        provs.appendChild(providerBtn(\"github\", \"Continue with GitHub\", GH_ICON, pick(\"GitHub\")));\n        provs.appendChild(providerBtn(\"gitlab\", \"Continue with GitLab\", GL_ICON, pick(\"GitLab\")));\n        provs.appendChild(providerBtn(\"google\", \"Continue with Google\", GOOGLE_ICON, pick(\"Google\")));\n        provs.appendChild(providerBtn(\"apple\", \"Continue with Apple\", APPLE_ICON, pick(\"Apple\")));\n        card.appendChild(provs);\n\n        var legal = window.RC.el(\"p\", \"auth-legal\");\n        legal.innerHTML = \"By continuing you agree to our \";\n        var tos = window.RC.el(\"button\", null, \"Terms of Use\");\n        tos.addEventListener(\"click\", function () { window.RC.go(\"terms\"); });\n        var priv = window.RC.el(\"button\", null, \"Privacy Policy\");\n        priv.addEventListener(\"click\", function () { window.RC.go(\"privacy\"); });\n        legal.appendChild(tos); legal.appendChild(document.createTextNode(\" and \")); legal.appendChild(priv);\n        legal.appendChild(document.createTextNode(\".\"));\n        card.appendChild(legal);\n\n        card.appendChild(window.RC.el(\"div\", \"auth-divider\", \"secured by OAuth\"));\n\n        var alt = window.RC.el(\"p\", \"auth-alt\");\n        alt.innerHTML = isSignup ? \"Already have an account? \" : \"New to Resources.co? \";\n        var altBtn = window.RC.el(\"button\", null, isSignup ? \"Log in\" : \"Create an account\");\n        altBtn.addEventListener(\"click\", function () { window.RC.go(isSignup ? \"login\" : \"signup\"); });\n        alt.appendChild(altBtn);\n        card.appendChild(alt);\n\n        var note = window.RC.el(\"div\", \"auth-note\");\n        note.innerHTML = INFO_ICON + \"<span>Demo only \\u2014 no real account is created. Either provider signs you in as <b>macchiato-dev<\u002Fb>.<\u002Fspan>\";\n        card.appendChild(note);\n\n        wrap.appendChild(card);\n        return [wrap];\n      }\n\n      window.RC.registerRoute(\"login\", { navKey: null, path: [{ label: \"Log in\" }], build: function () { return buildAuth(\"login\"); } });\n      window.RC.registerRoute(\"signup\", { navKey: null, path: [{ label: \"Sign up\" }], build: function () { return buildAuth(\"signup\"); } });\n\n      // ---- legal pages ----\n      function legalDoc(title, updated, sections) {\n        var wrap = window.RC.el(\"div\", \"auth-wrap\");\n        var card = window.RC.el(\"article\", \"box legal-card\");\n        card.appendChild(window.RC.el(\"h1\", \"legal-h1\", title));\n        card.appendChild(window.RC.el(\"div\", \"legal-updated\", \"Last updated \" + updated));\n        sections.forEach(function (s) {\n          card.appendChild(window.RC.el(\"h2\", \"legal-h2\", s.h));\n          s.p.forEach(function (para) { card.appendChild(window.RC.el(\"p\", \"legal-p\", para)); });\n        });\n        var note = window.RC.el(\"div\", \"auth-note\");\n        note.innerHTML = INFO_ICON + \"<span>Placeholder copy for this prototype — not legal advice. Replace with reviewed terms before launch.<\u002Fspan>\";\n        card.appendChild(note);\n        wrap.appendChild(card);\n        return [wrap];\n      }\n      window.RC.registerRoute(\"terms\", { navKey: null, path: [{ label: \"Terms of Use\" }], build: function () {\n        return legalDoc(\"Terms of Use\", \"June 2026\", [\n          { h: \"1. Accepting these terms\", p: [\"By creating an account or using Resources.co, you agree to these Terms of Use. If you don't agree, don't use the service.\"] },\n          { h: \"2. Your account\", p: [\"You can sign in with GitHub, GitLab, Google, or Apple. You're responsible for activity under your account and for keeping your provider credentials secure.\"] },\n          { h: \"3. Content and namespaces\", p: [\"You retain ownership of what you publish under your namespace. You grant other users the rights you choose when you make a project public.\"] },\n          { h: \"4. Acceptable use\", p: [\"Don't upload malware, infringe others' rights, or abuse the platform's resources. We may suspend accounts that do.\"] },\n          { h: \"5. Termination\", p: [\"You can delete your account at any time. We may suspend or close accounts that violate these terms.\"] }\n        ]);\n      } });\n      window.RC.registerRoute(\"privacy\", { navKey: null, path: [{ label: \"Privacy Policy\" }], build: function () {\n        return legalDoc(\"Privacy Policy\", \"June 2026\", [\n          { h: \"1. What we collect\", p: [\"When you sign in with a provider, we receive your name, email, and avatar from that provider. We store the projects and settings you create.\"] },\n          { h: \"2. How we use it\", p: [\"To run your account, show your namespace, and operate the service. We don't sell your personal data.\"] },\n          { h: \"3. Third-party sign-in\", p: [\"Authentication is handled by GitHub, GitLab, Google, or Apple. Their handling of your data is governed by their own privacy policies.\"] },\n          { h: \"4. Your choices\", p: [\"You can export or delete your data, and revoke a provider's access from that provider's settings at any time.\"] },\n          { h: \"5. Contact\", p: [\"Questions about privacy? Reach us at privacy@resources.co.\"] }\n        ]);\n      } });\n\n      var loginBtn = document.getElementById(\"login-btn\");\n      var signupBtn = document.getElementById(\"signup-btn\");\n      if (loginBtn) loginBtn.addEventListener(\"click\", function () { window.RC.go(\"login\"); });\n      if (signupBtn) signupBtn.addEventListener(\"click\", function () { window.RC.go(\"signup\"); });\n\n      Array.prototype.forEach.call(document.querySelectorAll(\".footer [data-foot]\"), function (b) {\n        b.addEventListener(\"click\", function () { window.RC.go(b.getAttribute(\"data-foot\")); });\n      });\n\n      var yourProjectsBtn = document.getElementById(\"your-projects-btn\");\n      if (yourProjectsBtn) yourProjectsBtn.addEventListener(\"click\", function () {\n        document.querySelectorAll(\".popover.open\").forEach(function (p) {\n          p.classList.remove(\"open\");\n          var par = p.parentNode && p.parentNode.querySelector(\"[data-pop]\");\n          if (par) par.setAttribute(\"aria-expanded\", \"false\");\n        });\n        window.RC.go(\"home\");\n      });\n\n      var signOutBtn = document.getElementById(\"sign-out-btn\");\n      if (signOutBtn) signOutBtn.addEventListener(\"click\", function () {\n        document.querySelectorAll(\".popover.open\").forEach(function (p) {\n          p.classList.remove(\"open\");\n          var par = p.parentNode && p.parentNode.querySelector(\"[data-pop]\");\n          if (par) par.setAttribute(\"aria-expanded\", \"false\");\n        });\n        setAuth(\"out\");\n        window.RC.go(\"home\");\n        authToast(\"Signed out\");\n      });\n    })();\n  <\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
