<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Markdown editor</title><link rel="stylesheet" href="./app.css"></head>
<body><div class="viewbar" role="toolbar" aria-label="Editor view"><button type="button" data-view="editor">Editor</button><button type="button" data-view="split" aria-pressed="true">Split</button><button type="button" data-view="preview">Preview</button></div><main data-view="split"><section class="source" aria-label="Project source"><div id="editor"></div></section><div class="splitter" role="separator" aria-label="Resize editor and preview" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" tabindex="0"></div><section class="preview" aria-label="Project preview"><div id="preview"></div><iframe id="project-preview" title="Project preview" sandbox="allow-scripts" hidden></iframe></section></main><script type="module" src="./app.js"></script></body></html>
