<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Classic Mahjong Solitaire</title>
</head>
<body>
<style>
:root{--ground:#102e29;--panel:#17473d;--line:#3d7467;--gold:#efc76f;--ink:#f7f0df;--muted:#b9d1ca;--tile:#e8d9bd}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px;color:var(--ink);background:radial-gradient(circle at 50% 35%,#246253,var(--ground) 72%);font:14px system-ui,sans-serif}
main{width:min(940px,100%);margin:auto}
header{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{margin:0;color:var(--gold);font:500 clamp(25px,4vw,39px) Georgia,serif}.subtitle,.stats{color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
button.action{padding:8px 12px;border:1px solid #8db7ab;border-radius:7px;color:var(--ink);background:#205c4e;font:inherit;font-weight:700;cursor:pointer}
button.action:hover{border-color:var(--gold);background:#2a725f}button.action[disabled]{opacity:.4;cursor:default}
.game{padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(5,28,24,.68);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.statusbar{display:flex;justify-content:space-between;gap:12px;min-height:25px;padding:0 4px 9px}.message{color:#f4d999}
.board-scroll{overflow:auto;max-height:calc(100vh - 180px);border:1px solid #2b5d51;border-radius:11px;background:#0b2924}
#board{position:relative;width:690px;height:430px;margin:12px auto}
.tile{position:absolute;left:0;top:0;z-index:1;width:50px;height:68px;padding:0;overflow:hidden;border:1px solid #c5b391;border-radius:5px;background:var(--tile);box-shadow:2px 3px 0 #735e3d,4px 5px 7px rgba(0,0,0,.38);cursor:default;filter:saturate(.82) brightness(.78)}
.tile img{position:absolute;left:0;top:0;max-width:none;pointer-events:none}.tile.bonus img{inset:0;width:100%;height:100%;object-fit:contain}
.tile.free{cursor:pointer;filter:none}.tile.free:hover,.tile.free:focus-visible{outline:2px solid var(--gold);outline-offset:1px;transform:translateY(-2px)}
.tile.selected{outline:3px solid #72d7ff;outline-offset:1px;transform:translateY(-4px)}
.tile[hidden]{display:none}
footer{display:flex;justify-content:space-between;gap:12px;margin-top:9px;color:var(--muted);font-size:11px}
@media(max-width:620px){body{padding:8px}header{align-items:start;flex-direction:column}.controls{justify-content:flex-start}.board-scroll{max-height:calc(100vh - 220px)}footer{display:block}footer span{display:block;margin-top:4px}}
</style>
<main>
<img id="tile-source" hidden alt="">
<header><div><h1>Classic Mahjong Solitaire</h1><div class="subtitle">Match two free tiles to clear the layered board.</div></div><div class="controls"><button class="action" id="hint">Hint</button><button class="action" id="shuffle">Shuffle remaining</button><button class="action" id="new">New game</button></div></header>
<section class="game"><div class="statusbar"><span class="message" id="message">Select any highlighted free tile.</span><span class="stats" id="stats">144 tiles · 0 moves</span></div><div class="board-scroll"><div id="board" role="grid" aria-label="Mahjong solitaire board"></div></div></section>
<footer><span>Tile art: FluffyStuff/xhokir, CC BY 4.0</span><span>A free tile has no tile above it and an open left or right side.</span></footer>
</main>
<script>
const BASE='https://cdn.jsdelivr.net/gh/xhokir/riichi-mahjong-tiles@master/';
const SPRITE=BASE+'ExampleRegular.png';
const BONUS=[1,2,3,4].map(n=>BASE+'Regular/Flower'+n+'.svg').concat([1,2,3,4].map(n=>BASE+'Regular/Season'+n+'.svg'));
const NAMES={E:'East wind',S:'South wind',W:'West wind',N:'North wind',R:'Red dragon',G:'Green dragon',H:'White dragon'};
const REGULAR=(()=>{const out=[];['m','p','s'].forEach(s=>{for(let n=1;n<=9;n++)out.push(s+n)});return out.concat(['E','S','W','N','R','H','G'])})();
const state={tiles:[],selected:-1,moves:0,history:[],over:false};
let sprite='',bonusArt=[];
function positions(){const out=[];function layer(z,w,h,x,y){for(let row=0;row<h;row++)for(let col=0;col<w;col++)out.push({x:x+col,y:y+row,z})}layer(0,12,6,0,0);layer(1,10,5,1,.5);layer(2,6,3,3,1.5);layer(3,2,2,5,2);return out}
function pairTypes(){const out=[];REGULAR.forEach(t=>out.push(t,t));REGULAR.forEach(t=>out.push(t,t));[0,1,4,5].forEach(n=>out.push('f'+n,'f'+n));return out}
function assignTiles(){const pos=positions(),types=pairTypes(),tiles=[];for(let z=3;z>=0;z--){const rows=[...new Set(pos.filter(p=>p.z===z).map(p=>p.y))];for(const y of rows){const row=pos.filter(p=>p.z===z&&p.y===y).sort((a,b)=>a.x-b.x);while(row.length){const a=row.shift(),b=row.pop();const type=types.splice(0,1)[0];tiles.push({...a,type,match:type[0]==='f'?(+type.slice(1)<4?'flowers':'seasons'):type,removed:false});tiles.push({...b,type,match:type[0]==='f'?(+type.slice(1)<4?'flowers':'seasons'):type,removed:false})}}}return tiles}
function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=array[i];array[i]=array[j];array[j]=x}return array}
function spriteCell(t){if(t[0]==='m')return[+t[1]-1,0];if(t[0]==='p')return[+t[1]-1,1];if(t[0]==='s')return[+t[1]-1,2];return[{E:0,S:1,W:2,N:3,R:4,H:5,G:6}[t],3]}
function tileName(t){if(t[0]==='f')return +t.slice(1)<4?'Flower':'Season';return NAMES[t]||t[1]+' '+({m:'characters',p:'dots',s:'bamboo'}[t[0]])}
function overlaps(a,b){return Math.abs(a.x-b.x)<1&&Math.abs(a.y-b.y)<1}
function free(index){const t=state.tiles[index];if(t.removed)return false;const above=state.tiles.some(o=>!o.removed&&o.z>t.z&&overlaps(t,o));if(above)return false;const left=state.tiles.some(o=>!o.removed&&o.z===t.z&&Math.abs(o.y-t.y)<.5&&o.x<t.x&&t.x-o.x<=1);const right=state.tiles.some(o=>!o.removed&&o.z===t.z&&Math.abs(o.y-t.y)<.5&&o.x>t.x&&o.x-t.x<=1);return !left||!right}
function paint(button,t,index){button.className='tile'+(t.type[0]==='f'?' bonus':'')+(free(index)?' free':'')+(state.selected===index?' selected':'');button.hidden=t.removed;button.title=tileName(t.type)+(free(index)?' · free':' · blocked');button.setAttribute('aria-label',button.title);button.style.left=(14+t.x*54+t.z*5)+'px';button.style.top=(18+t.y*58-t.z*5)+'px';button.style.zIndex=String(10+t.z*100+Math.round(t.y*2));const image=button.querySelector('img');const source=t.type[0]==='f'?bonusArt[+t.type.slice(1)]:sprite;if(image.src!==source)image.src=source;if(t.type[0]!=='f'){const cell=spriteCell(t.type),scale=.435;image.style.width=2048*scale+'px';image.style.height=654*scale+'px';image.style.left=-(cell[0]*204.8+47)*scale+'px';image.style.top=-(cell[1]*163.5+7)*scale+'px'}}
function remaining(){return state.tiles.filter(t=>!t.removed).length}
function availablePairs(){const freeTiles=state.tiles.map((t,i)=>({t,i})).filter(x=>free(x.i));const pairs=[];for(let a=0;a<freeTiles.length;a++)for(let b=a+1;b<freeTiles.length;b++)if(freeTiles[a].t.match===freeTiles[b].t.match)pairs.push([freeTiles[a].i,freeTiles[b].i]);return pairs}
function render(message=''){const board=document.getElementById('board');for(let i=0;i<state.tiles.length;i++)paint(board.children[i],state.tiles[i],i);const left=remaining();document.getElementById('stats').textContent=left+' tiles · '+state.moves+' moves';document.getElementById('shuffle').disabled=state.over||left===0;document.getElementById('hint').disabled=state.over||left===0;if(message)document.getElementById('message').textContent=message;else if(!left)document.getElementById('message').textContent='Board cleared in '+state.moves+' moves!';else if(!availablePairs().length)document.getElementById('message').textContent='No free matches remain. Shuffle the remaining tiles.';else document.getElementById('message').textContent=state.selected<0?'Select any highlighted free tile.':'Now select a matching free tile.'}
function choose(index){if(state.over||!free(index))return;if(state.selected<0){state.selected=index;render();return}if(state.selected===index){state.selected=-1;render();return}const first=state.tiles[state.selected],second=state.tiles[index];if(first.match!==second.match){state.selected=index;render('Those tiles do not match. Selected '+tileName(second.type)+' instead.');return}state.history.push([state.selected,index]);first.removed=true;second.removed=true;state.selected=-1;state.moves++;if(!remaining())state.over=true;render()}
function build(){const board=document.getElementById('board');state.tiles=assignTiles();state.selected=-1;state.moves=0;state.history=[];state.over=false;if(!board.children.length)for(let i=0;i<144;i++){const button=document.createElement('button'),image=document.createElement('img');button.type='button';button.setAttribute('role','gridcell');button.dataset.index=i;image.alt='';button.append(image);button.addEventListener('click',()=>choose(+button.dataset.index));board.append(button)}render('Select two matching highlighted tiles. Outer and upper tiles are free first.')}
document.getElementById('new').addEventListener('click',build);
document.getElementById('hint').addEventListener('click',()=>{const pair=availablePairs()[0];if(!pair){render('No free matches remain. Shuffle the remaining tiles.');return}state.selected=pair[0];render('Hint: the selected '+tileName(state.tiles[pair[0]].type)+' has a free match.')});
document.getElementById('shuffle').addEventListener('click',()=>{const live=state.tiles.filter(t=>!t.removed),types=shuffle(live.map(t=>({type:t.type,match:t.match})));live.forEach((t,i)=>Object.assign(t,types[i]));state.selected=-1;render('Remaining tiles shuffled. Look for a highlighted matching pair.')});
const loaded=await Promise.all([SPRITE].concat(BONUS).map(url=>fetch(url).then(response=>{if(!response.ok)throw new Error('Tile art failed to load');return response.resourceUrl()})));sprite=loaded[0];bonusArt=loaded.slice(1);build();
</script>
</body>
</html>
