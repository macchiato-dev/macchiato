<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Classic Chinese Mahjong</title>
</head>
<body>
<style>
:root{--felt:#123e34;--felt2:#0b2d27;--gold:#e9bf69;--ink:#f6eedc;--muted:#aecbc2;--line:#376b5e;--panel:#0d302a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px;color:var(--ink);background:radial-gradient(circle at 50% 42%,#1c5a4b,var(--felt2) 72%);font:14px system-ui,sans-serif}
main{width:min(1100px,100%);margin:auto}
header{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:14px}
h1{margin:0;font-family:Georgia,serif;font-size:clamp(24px,4vw,38px);font-weight:500;color:var(--gold)}
.subtitle,.status{color:var(--muted)}
.table{display:grid;grid-template-columns:1fr minmax(260px,2fr) 1fr;grid-template-rows:auto auto auto;gap:12px;padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(7,31,26,.72);box-shadow:0 18px 50px rgba(0,0,0,.3)}
.player{min-width:0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.player h2{display:flex;justify-content:space-between;margin:0 0 8px;font-size:13px;color:var(--gold)}
.north{grid-column:2}.west{grid-column:1;grid-row:2}.center{grid-column:2;grid-row:2;min-height:210px;display:grid;align-content:center;text-align:center}.east{grid-column:1/4;grid-row:3}.south{grid-column:3;grid-row:2}
.backs,.melds,.discards,.hand,.flowers{display:flex;flex-wrap:wrap;gap:3px;min-height:30px}
.back{width:18px;height:25px;border:1px solid #8d6d3c;border-radius:3px;background:linear-gradient(135deg,#dcbd72,#8f632d)}
.tile{position:relative;width:54px;height:72px;flex:0 0 54px;padding:0;overflow:hidden;border:1px solid #c9bca7;border-radius:5px;background:#f4efe5;box-shadow:1px 2px 2px rgba(0,0,0,.3);cursor:pointer}
.tile img{position:absolute;left:0;top:0;max-width:none;pointer-events:none}
.tile:hover,.tile:focus-visible{outline:2px solid var(--gold);outline-offset:1px}.tile.selected{transform:translateY(-8px);outline:2px solid var(--gold)}
.tile.bonus img{inset:0;width:100%;height:100%;object-fit:contain}
.tile.small{width:29px;height:39px;flex-basis:29px;border-radius:3px}
.tile[disabled]{cursor:default}.tile[disabled]:hover{outline:none}
.center strong{font:28px Georgia,serif;color:var(--gold)}
.wall{margin:6px 0;font-variant-numeric:tabular-nums}.last{min-height:78px;display:grid;place-items:center}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:10px}
button.action{padding:7px 11px;border:1px solid #8fb6aa;border-radius:7px;color:var(--ink);background:#1d5649;font:inherit;font-weight:700;cursor:pointer}
button.action:hover{border-color:var(--gold);background:#276b5b}button.action[disabled]{opacity:.4;cursor:default}
.east-layout{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.east .hand{align-items:end}.east aside{width:150px}
.notice{min-height:22px;margin-top:10px;color:#f5d89b;text-align:center}
footer{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:var(--muted);font-size:11px}
@media(max-width:720px){body{padding:8px}.table{grid-template-columns:1fr 1fr}.north{grid-column:1/3}.west{grid-column:1;grid-row:2}.south{grid-column:2;grid-row:2}.center{grid-column:1/3;grid-row:3}.east{grid-column:1/3;grid-row:4}.east-layout{grid-template-columns:1fr}.east aside{width:auto}}
</style>
<main>
<img id="tile-source" hidden alt="">
<header><div><h1>Classic Chinese Mahjong</h1><div class="subtitle">Four players · flowers and seasons · simple traditional play</div></div><button class="action" id="new">New hand</button></header>
<section class="table">
  <section class="player north" id="player-2"><h2><span>West · Bot</span><span class="count"></span></h2><div class="backs"></div><div class="melds"></div><div class="flowers"></div></section>
  <section class="player west" id="player-3"><h2><span>North · Bot</span><span class="count"></span></h2><div class="backs"></div><div class="melds"></div><div class="flowers"></div></section>
  <section class="center"><strong id="turn">East</strong><div class="wall" id="wall"></div><div class="last" id="last"></div><div class="actions"><button class="action" id="draw">Draw</button><button class="action" id="discard" disabled>Discard selected</button><button class="action" id="chow" hidden>Chow</button><button class="action" id="pung" hidden>Pung</button><button class="action" id="win" disabled>Mahjong!</button></div><div class="notice" id="notice"></div></section>
  <section class="player south" id="player-1"><h2><span>South · Bot</span><span class="count"></span></h2><div class="backs"></div><div class="melds"></div><div class="flowers"></div></section>
  <section class="player east" id="player-0"><h2><span>East · You</span><span class="count"></span></h2><div class="east-layout"><div><div class="hand" id="hand"></div><div class="melds"></div></div><aside><div>Bonus tiles</div><div class="flowers"></div></aside></div></section>
</section>
<footer><span>Tile art: FluffyStuff/xhokir, CC BY 4.0</span><span>Prototype rules: draw, discard, chow, pung, and four-meld Mahjong</span></footer>
</main>
<script>
const BASE='https://cdn.jsdelivr.net/gh/xhokir/riichi-mahjong-tiles@master/';
const SPRITE=BASE+'ExampleRegular.png';
const BONUS=[1,2,3,4].map(n=>BASE+'Regular/Flower'+n+'.svg').concat([1,2,3,4].map(n=>BASE+'Regular/Season'+n+'.svg'));
const TILE_NAMES={E:'East',S:'South',W:'West',N:'North',R:'Red dragon',G:'Green dragon',H:'White dragon'};
const winds=['East','South','West','North'];
const state={wall:[],hands:[[],[],[],[]],melds:[[],[],[],[]],bonus:[[],[],[],[]],discards:[[],[],[],[]],turn:0,drawn:false,selected:-1,last:null,over:false};
let sprite='';let bonusArt=[];
function regularTypes(){const out=[];['m','p','s'].forEach(s=>{for(let n=1;n<=9;n++)out.push(s+n)});return out.concat(['E','S','W','N','R','H','G'])}
function makeWall(){const wall=[];regularTypes().forEach(t=>{for(let i=0;i<4;i++)wall.push(t)});for(let i=0;i<8;i++)wall.push('f'+i);for(let i=wall.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=wall[i];wall[i]=wall[j];wall[j]=x}return wall}
function isBonus(t){return t[0]==='f'}
function sortHand(hand){hand.sort((a,b)=>regularTypes().indexOf(a)-regularTypes().indexOf(b))}
function replenish(player){while(state.hands[player].some(isBonus)){const i=state.hands[player].findIndex(isBonus);state.bonus[player].push(state.hands[player].splice(i,1)[0]);if(state.wall.length)state.hands[player].push(state.wall.pop())}sortHand(state.hands[player])}
function spriteCell(t){let col,row;if(t[0]==='m'){col=+t[1]-1;row=0}else if(t[0]==='p'){col=+t[1]-1;row=1}else if(t[0]==='s'){col=+t[1]-1;row=2}else{col={E:0,S:1,W:2,N:3,R:4,H:5,G:6}[t];row=3}return [col,row]}
function paintTile(b,t,index,small=false){b.className='tile'+(small?' small':'')+(isBonus(t)?' bonus':'')+(index===state.selected?' selected':'');b.title=isBonus(t)?'Bonus tile':TILE_NAMES[t]||t[1]+' '+({m:'characters',p:'dots',s:'bamboo'}[t[0]]);b.setAttribute('aria-label',b.title);b.dataset.index=index==null?'':index;const image=b.querySelector('img');const source=isBonus(t)?bonusArt[+t.slice(1)]:sprite;if(image.src!==source)image.src=source;if(!isBonus(t)){const cell=spriteCell(t),scale=small?.254:.47;image.style.width=2048*scale+'px';image.style.height=654*scale+'px';image.style.left=-(cell[0]*204.8+45)*scale+'px';image.style.top=-(cell[1]*163.5+6)*scale+'px'}}
function tileButton(t,index,small=false){const b=document.createElement('button'),image=document.createElement('img');b.type='button';image.alt='';b.append(image);paintTile(b,t,index,small);if(index!=null)b.addEventListener('click',()=>{state.selected=+b.dataset.index;const old=document.getElementById('hand').querySelector('.selected');if(old)old.classList.remove('selected');b.classList.add('selected');document.getElementById('discard').disabled=false});else b.disabled=true;return b}
function renderHand(){const hand=document.getElementById('hand');while(hand.children.length<14)hand.append(tileButton(state.hands[0][0]||'E',hand.children.length));for(let i=0;i<14;i++){const b=hand.children[i];b.hidden=i>=state.hands[0].length;if(!b.hidden)paintTile(b,state.hands[0][i],i)}}
function renderPlayer(p){const root=document.getElementById('player-'+p);root.querySelector('.count').textContent=state.hands[p].length+' tiles';const backs=root.querySelector('.backs');backs.replaceChildren(...state.hands[p].map(()=>{const x=document.createElement('span');x.className='back';return x}));root.querySelector('.melds').replaceChildren(...state.melds[p].flat().map(t=>tileButton(t,null,true)));root.querySelector('.flowers').replaceChildren(...state.bonus[p].map(t=>tileButton(t,null,true)))}
function render(){for(let p=1;p<4;p++)renderPlayer(p);const east=document.getElementById('player-0');renderHand();east.querySelector('.count').textContent=state.hands[0].length+' tiles';east.querySelector('.melds').replaceChildren(...state.melds[0].flat().map(t=>tileButton(t,null,true)));east.querySelector('.flowers').replaceChildren(...state.bonus[0].map(t=>tileButton(t,null,true)));document.getElementById('turn').textContent=winds[state.turn];document.getElementById('wall').textContent=state.wall.length+' tiles remain';const last=document.getElementById('last');if(!last.children.length)last.append(tileButton('E',null));last.children[0].hidden=!state.last;if(state.last)paintTile(last.children[0],state.last.tile,null);document.getElementById('draw').disabled=state.over||state.turn!==0||state.drawn;document.getElementById('discard').disabled=state.over||state.turn!==0||!state.drawn||state.selected<0;document.getElementById('win').disabled=state.over||state.turn!==0||!state.drawn||!winning(state.hands[0]);}
function drawFor(p){if(!state.wall.length){state.over=true;notice('The wall is empty. Drawn hand.');return}state.hands[p].push(state.wall.pop());replenish(p);state.drawn=true;state.selected=-1;render()}
function discardFor(p,index){const tile=state.hands[p].splice(index,1)[0];state.discards[p].push(tile);state.last={player:p,tile};state.drawn=false;state.selected=-1;if(p===0){state.turn=1;setTimeout(botRound,250)}else render()}
function botRound(){for(let p=1;p<4;p++){if(!state.wall.length){state.over=true;notice('The wall is empty. Drawn hand.');render();return}state.hands[p].push(state.wall.pop());replenish(p);const tile=state.hands[p].pop();state.discards[p].push(tile);state.last={player:p,tile}}state.turn=0;state.drawn=false;offerClaims();render()}
function counts(hand){const c={};hand.forEach(t=>c[t]=(c[t]||0)+1);return c}
function setsPossible(c,left){if(left===0)return true;const t=regularTypes().find(x=>c[x]);if(!t)return false;if(c[t]>=3){c[t]-=3;if(setsPossible(c,left-1))return true;c[t]+=3}if(/[mps]/.test(t[0])&&+t[1]<=7){const a=t[0]+(+t[1]+1),b=t[0]+(+t[1]+2);if(c[a]&&c[b]){c[t]--;c[a]--;c[b]--;if(setsPossible(c,left-1))return true;c[t]++;c[a]++;c[b]++}}return false}
function winning(hand){if((hand.length+state.melds[0].length*3)!==14)return false;const c=counts(hand);return regularTypes().some(t=>{if((c[t]||0)<2)return false;c[t]-=2;const ok=setsPossible(c,4-state.melds[0].length);c[t]+=2;return ok})}
function offerClaims(){const t=state.last.tile,c=counts(state.hands[0]);const pung=c[t]>=2;let chow=false;if(t[0]&&/[mps]/.test(t[0])){const n=+t[1];chow=[[n-2,n-1],[n-1,n+1],[n+1,n+2]].some(pair=>pair.every(x=>x>=1&&x<=9&&c[t[0]+x]))}document.getElementById('pung').hidden=!pung;document.getElementById('chow').hidden=!chow;notice(pung||chow?'You may claim North’s discard, or draw.':'Your turn. Draw from the wall.')}
function claim(kind){const t=state.last.tile;const need=kind==='pung'?[t,t]:(()=>{const c=counts(state.hands[0]),n=+t[1];return [[n-2,n-1],[n-1,n+1],[n+1,n+2]].map(x=>x.map(v=>t[0]+v)).find(pair=>pair.every(x=>c[x]))})();need.forEach(x=>state.hands[0].splice(state.hands[0].indexOf(x),1));state.melds[0].push([t].concat(need));state.turn=0;state.drawn=true;document.getElementById('pung').hidden=true;document.getElementById('chow').hidden=true;notice('Claimed '+kind+'. Select a discard.');sortHand(state.hands[0]);render()}
function notice(text){document.getElementById('notice').textContent=text}
function start(){Object.assign(state,{wall:makeWall(),hands:[[],[],[],[]],melds:[[],[],[],[]],bonus:[[],[],[],[]],discards:[[],[],[],[]],turn:0,drawn:false,selected:-1,last:null,over:false});for(let round=0;round<13;round++)for(let p=0;p<4;p++)state.hands[p].push(state.wall.pop());for(let p=0;p<4;p++)replenish(p);notice('East begins. Draw a tile.');render()}
document.getElementById('new').addEventListener('click',start);document.getElementById('draw').addEventListener('click',()=>drawFor(0));document.getElementById('discard').addEventListener('click',()=>discardFor(0,state.selected));document.getElementById('pung').addEventListener('click',()=>claim('pung'));document.getElementById('chow').addEventListener('click',()=>claim('chow'));document.getElementById('win').addEventListener('click',()=>{state.over=true;notice('Mahjong! East wins the hand.');render()});
const loaded=await Promise.all([SPRITE].concat(BONUS).map(url=>fetch(url).then(response=>{if(!response.ok)throw new Error('Tile art failed to load');return response.dataUrl()})));sprite=loaded[0];bonusArt=loaded.slice(1);start();
</script>
</body>
</html>
