<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Classic Mahjong Solitaire</title>
</head>
<body>
<style>
:root{--ground:#102e29;--panel:#17473d;--line:#3d7467;--gold:#efc76f;--ink:#f7f0df;--muted:#b9d1ca;--tile:#e8d9bd}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px;color:var(--ink);background:radial-gradient(circle at 50% 35%,#246253,var(--ground) 72%);font:14px system-ui,sans-serif}
main{width:min(940px,100%);margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{margin:0;color:var(--gold);font:500 clamp(25px,4vw,39px) Georgia,serif}.subtitle,.stats{color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
button.action{padding:8px 12px;border:1px solid #8db7ab;border-radius:7px;color:var(--ink);background:#205c4e;font:inherit;font-weight:700;cursor:pointer}
button.action:hover{border-color:var(--gold);background:#2a725f}button.action[disabled]{opacity:.4;cursor:default}
.game{padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(5,28,24,.68);box-shadow:0 18px 50px rgba(0,0,0,.28)}
.statusbar{display:flex;justify-content:space-between;gap:12px;min-height:25px;padding:0 4px 9px}.message{color:#f4d999}
.board-scroll{overflow:visible;border:1px solid #2b5d51;border-radius:11px;background:#0b2924;padding:clamp(12px,2.5vw,20px)}
#board{container-type:inline-size;position:relative;width:min(760px,100%);aspect-ratio:760/590;margin:0 auto}
.tile{position:absolute;left:0;top:0;z-index:1;width:calc(50 / 760 * 100cqw);height:calc(66 / 760 * 100cqw);padding:0;overflow:hidden;border:1px solid #c5b391;border-radius:5px;background:var(--tile);box-shadow:2px 3px 0 #735e3d,4px 5px 7px rgba(0,0,0,.38);cursor:pointer;transition:filter 90ms linear,opacity 260ms ease-out}
.tile img{position:absolute;left:0;top:0;max-width:none;pointer-events:none}.tile.bonus img{inset:0;width:100%;height:100%;object-fit:contain}
.tile:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.tile.selected{filter:brightness(.66) saturate(.85)}
.tile.deselecting{filter:none}
.tile.removing{opacity:0;pointer-events:none}
.tile[hidden]{display:none}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}
footer{display:flex;justify-content:space-between;gap:12px;margin-top:9px;color:var(--muted);font-size:11px}
@media(max-width:620px){body{padding:8px}h1{font-size:clamp(21px,7vw,30px)}footer{display:block}footer span{display:block;margin-top:4px}}
</style>
<main>
<img id="tile-source" hidden alt="">
<header><h1>Classic Mahjong Solitaire</h1><button class="action" id="new">New game</button></header>
<section class="game"><div class="statusbar"><span class="message" id="message"></span><span class="stats" id="stats">144 tiles · 0 moves</span></div><div class="board-scroll"><div id="board" role="grid" aria-label="Mahjong solitaire turtle layout"></div></div></section>
<footer><span>Tile art: FluffyStuff/xhokir, CC BY 4.0</span></footer>
</main>
<script>
const BASE='https://cdn.jsdelivr.net/gh/xhokir/riichi-mahjong-tiles@master/';
const SPRITE=BASE+'ExampleRegular.png';
const BONUS=[1,2,3,4].map(n=>BASE+'Regular/Flower'+n+'.svg').concat([1,2,3,4].map(n=>BASE+'Regular/Season'+n+'.svg'));
const NAMES={E:'East wind',S:'South wind',W:'West wind',N:'North wind',R:'Red dragon',G:'Green dragon',H:'White dragon'};
const REGULAR=(()=>{const out=[];['m','p','s'].forEach(s=>{for(let n=1;n<=9;n++)out.push(s+n)});return out.concat(['E','S','W','N','R','H','G'])})();
const SOLUTION=[[131,57],[126,92],[135,11],[58,99],[143,74],[12,44],[117,10],[139,91],[86,141],[134,67],[110,125],[111,56],[0,59],[93,105],[85,124],[9,127],[84,140],[122,109],[138,1],[30,2],[29,116],[106,73],[3,137],[98,31],[83,20],[115,123],[97,118],[90,132],[89,96],[19,136],[104,121],[18,120],[68,130],[114,129],[8,94],[72,112],[17,71],[103,45],[46,82],[88,113],[32,119],[128,81],[102,4],[47,7],[100,6],[28,55],[80,60],[27,5],[48,95],[61,101],[26,54],[69,79],[21,43],[107,87],[49,22],[62,16],[15,33],[78,13],[142,14],[63,133],[53,70],[108,25],[50,34],[64,77],[24,51],[65,35],[36,76],[66,52],[23,75],[42,37],[38,41],[39,40]];
const state={tiles:[],selected:-1,moves:0,history:[],over:false,removing:new Set(),mismatch:new Set(),deselecting:false};
let sprite='',bonusArt=[];
function positions(){const out=[];function layer(z,w,h,x,y){for(let row=0;row<h;row++)for(let col=0;col<w;col++)out.push({x:x+col,y:y+row,z})}const rows=[[12,1],[8,3],[10,2],[14,0],[13,.5],[10,2],[8,3],[12,1]];rows.forEach(([count,x],y)=>layer(0,count,1,x,y));layer(1,6,6,4,1);layer(2,4,4,5,2);layer(3,2,2,6,3);out.push({x:6.5,y:3.5,z:4});return out}
function pairTypes(){const pairs=[];REGULAR.forEach(t=>pairs.push(t,t));[0,1,4,5].forEach(n=>pairs.push('f'+n));return shuffle(pairs)}
function assignTiles(){const pos=positions(),types=pairTypes(),assigned=new Array(pos.length);for(const pair of SOLUTION){const type=types.pop(),match=type[0]==='f'?(+type.slice(1)<4?'flowers':'seasons'):type;for(const index of pair)assigned[index]={...pos[index],type,match,removed:false}}return assigned}
function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=array[i];array[i]=array[j];array[j]=x}return array}
function spriteCell(t){if(t[0]==='m')return[+t[1]-1,0];if(t[0]==='p')return[+t[1]-1,1];if(t[0]==='s')return[+t[1]-1,2];return[{E:0,S:1,W:2,N:3,R:4,H:5,G:6}[t],3]}
function tileName(t){if(t[0]==='f')return +t.slice(1)<4?'Flower':'Season';return NAMES[t]||t[1]+' '+({m:'characters',p:'dots',s:'bamboo'}[t[0]])}
function overlaps(a,b){return Math.abs(a.x-b.x)<1&&Math.abs(a.y-b.y)<1}
function free(index){const t=state.tiles[index];if(t.removed)return false;const above=state.tiles.some(o=>!o.removed&&o.z>t.z&&overlaps(t,o));if(above)return false;const left=state.tiles.some(o=>!o.removed&&o.z===t.z&&Math.abs(o.y-t.y)<.5&&o.x<t.x&&t.x-o.x<=1);const right=state.tiles.some(o=>!o.removed&&o.z===t.z&&Math.abs(o.y-t.y)<.5&&o.x>t.x&&o.x-t.x<=1);return !left||!right}
function paint(button,t,index){const selected=state.selected===index||state.mismatch.has(index);button.className='tile'+(t.type[0]==='f'?' bonus':'')+(selected?' selected':'')+(selected&&state.deselecting?' deselecting':'')+(state.removing.has(index)?' removing':'');button.hidden=t.removed&&!state.removing.has(index);button.title=tileName(t.type);button.setAttribute('aria-label',button.title);button.style.left=(15+t.x*52+t.z*5)/7.6+'cqw';button.style.top=(24+t.y*68-t.z*5)/7.6+'cqw';button.style.zIndex=String(10+t.z*100+Math.round(t.y*2));const image=button.querySelector('img'),bonus=t.type[0]==='f',source=bonus?bonusArt[+t.type.slice(1)]:sprite;if(image.src!==source)image.src=source;if(bonus){image.style.inset='0';image.style.left='0';image.style.top='0';image.style.width='100%';image.style.height='100%';image.style.objectFit='contain'}else{const cell=spriteCell(t.type),scale=.435;image.style.inset='auto';image.style.objectFit='fill';image.style.width=2048*scale/7.6+'cqw';image.style.height=654*scale/7.6+'cqw';image.style.left=-(cell[0]*204.8+47)*scale/7.6+'cqw';image.style.top=-(cell[1]*163.5+7)*scale/7.6+'cqw'}}
function remaining(){return state.tiles.filter(t=>!t.removed).length}
function availablePairs(){const freeTiles=state.tiles.map((t,i)=>({t,i})).filter(x=>free(x.i));const pairs=[];for(let a=0;a<freeTiles.length;a++)for(let b=a+1;b<freeTiles.length;b++)if(freeTiles[a].t.match===freeTiles[b].t.match)pairs.push([freeTiles[a].i,freeTiles[b].i]);return pairs}
function render(message=''){const board=document.getElementById('board');for(let i=0;i<state.tiles.length;i++)paint(board.children[i],state.tiles[i],i);const left=remaining();document.getElementById('stats').textContent=left+' tiles · '+state.moves+' moves';if(message)document.getElementById('message').textContent=message;else if(!left)document.getElementById('message').textContent='Board cleared in '+state.moves+' moves!';else if(!availablePairs().length)document.getElementById('message').textContent='No moves remain. Start a new game.';else document.getElementById('message').textContent=''}
function choose(index){if(state.over||state.removing.size||state.mismatch.size||!free(index))return;if(state.selected<0){state.selected=index;render();return}if(state.selected===index){state.selected=-1;render();return}const firstIndex=state.selected,first=state.tiles[firstIndex],second=state.tiles[index];if(first.match!==second.match){state.selected=-1;state.mismatch.add(firstIndex);state.mismatch.add(index);render();setTimeout(()=>{state.deselecting=true;render();setTimeout(()=>{state.mismatch.clear();state.deselecting=false;render()},110)},120);return}state.history.push([firstIndex,index]);first.removed=true;second.removed=true;state.removing.add(firstIndex);state.removing.add(index);state.selected=-1;state.moves++;if(!remaining())state.over=true;render();setTimeout(()=>{state.removing.clear();render()},260)}
function build(){const board=document.getElementById('board');state.tiles=assignTiles();state.selected=-1;state.moves=0;state.history=[];state.over=false;state.removing.clear();state.mismatch.clear();state.deselecting=false;if(!board.children.length)for(let i=0;i<144;i++){const button=document.createElement('button'),image=document.createElement('img');button.type='button';button.setAttribute('role','gridcell');button.dataset.index=i;image.alt='';button.append(image);button.addEventListener('click',()=>choose(+button.dataset.index));board.append(button)}render()}
document.getElementById('new').addEventListener('click',build);
const loaded=await Promise.all([SPRITE].concat(BONUS).map(url=>fetch(url).then(response=>{if(!response.ok)throw new Error('Tile art failed to load');return response.resourceUrl()})));sprite=loaded[0];bonusArt=loaded.slice(1);build();
</script>
</body>
</html>
